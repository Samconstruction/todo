Object.assign(ES,{"What's new: one at a time": "Novedades: una por una", "Each new update now pops up by itself, one at a time, with a Try it button that takes you right to it. Got it shows the next one. The full list is still in More → What's new.": "Cada actualización nueva ahora aparece sola, una por una, con un botón Probar que te lleva directo. Entendido muestra la siguiente. La lista completa sigue en Más → Novedades.", "Workers: Back on Phones": "Trabajadores: Atrás en Teléfonos", "For workers, Back on the Phones tab now goes to Today instead of closing the app. Try it shows the app as a worker.": "Para los trabajadores, Atrás en Teléfonos ahora va a Hoy en vez de cerrar la app. Probar muestra la app como un trabajador.", "A voice note is never saved twice": "Una nota de voz nunca se guarda dos veces", "On a weak signal (or when the server is slow) a voice note that is sent again by itself is now saved only once.": "Con poca señal (o si el servidor está lento) una nota de voz que se vuelve a enviar sola ahora se guarda una sola vez.", "Waiting messages are kept on sign out": "Lo que espera señal se guarda al salir", "Messages, Done, reports and overtime still waiting for signal are no longer thrown away when someone signs out (or their PIN is changed). They go out when that person signs in again.": "Mensajes, Listo, reportes y horas extra que esperan señal ya no se borran cuando alguien sale de la app (o le cambian el PIN). Se envían cuando esa persona vuelve a entrar.", "Updates wait for uploads": "Las actualizaciones esperan a que se suba todo", "A new app version now waits until your photos, videos and files have finished sending before it reloads.": "Una versión nueva de la app ahora espera a que tus fotos, videos y archivos terminen de enviarse antes de recargar.", "Editing a task keeps the other person's change": "Editar una tarea respeta el cambio del otro", "When you edit a task, Save now sends only what you changed. If Rocky moved it to tomorrow at the same time and you only fixed the title, his new date stays.": "Al editar una tarea, Guardar ahora envía solo lo que tú cambiaste. Si Rocky la pasó a mañana al mismo tiempo y tú solo arreglaste el título, su fecha nueva se queda.", "Morning question: only in the morning": "Pregunta de la mañana: solo en la mañana", "The 'bring late tasks to today' question now asks only in the morning (5 AM to noon) on a work day, on the Today screen, right after you open the app – never in the middle of work, at night or on Shabbos/Yom Tov. Schedule ride tasks are left out.": "La pregunta de pasar tareas atrasadas a hoy ahora sale solo en la mañana (5 AM a mediodía) en un día de trabajo, en la pantalla Hoy, justo al abrir la app – nunca en medio del trabajo, de noche o en Shabbos/Yom Tov. Las tareas de transporte del horario no se incluyen.", "Next work day knows Jewish holidays": "El siguiente día de trabajo conoce los días festivos judíos", "Moving tasks never lands on Shabbos, and before a Jewish holiday it asks which day you want. The morning question doesn't ask on a holiday. Schedule ride tasks are never moved.": "Pasar tareas nunca cae en Shabbos, y antes de un día festivo judío pregunta qué día quieres. La pregunta de la mañana no sale en un día festivo. Las tareas de transporte del horario nunca se mueven.", "Old schedules: Fix this day works": "Horarios viejos: Corregir este día funciona", "Schedule → a day more than 2 weeks back → Fix this day now opens that day's real plan (before, it opened empty and sending it would have wiped the day).": "Horario → un día de hace más de 2 semanas → Corregir este día ahora abre el plan real de ese día (antes abría vacío y al enviarlo borraba el día).", "Share keeps you in the chat": "Compartir te deja en el chat", "Holding a message and tapping Share (when the file is still loading) now shows a small card on top of the chat. Share, Cancel or Back keeps you in the chat.": "Al mantener un mensaje y tocar Compartir (cuando el archivo todavía carga) ahora sale una tarjetita encima del chat. Compartir, Cancelar o Atrás te dejan en el chat.", "Forward to My notes shows as new": "Reenviar a Mis notas sale como nuevo", "Forwarding something to My notes now keeps you where you were, and My notes shows it as 1 new message.": "Reenviar algo a Mis notas ahora te deja donde estabas, y Mis notas lo muestra como 1 mensaje nuevo.", "More Back button fixes": "Más arreglos del botón Atrás", "Back now goes one step at a time in: group info → Add people / Photos; Messages on Groups → another tab; hold a message → more emojis (back to the chat); App maintenance → Notifications sent / Test the new chat features.": "Atrás ahora va un paso a la vez en: info del grupo → Agregar personas / Fotos; Mensajes en Grupos → otra pestaña; mantener un mensaje → más emojis (vuelve al chat); Mantenimiento → Avisos enviados / Probar el chat.", "Listened is per message": "Escuchado es por mensaje", "A voice note forwarded to someone now turns blue only when they play that copy, and playing a note in Job history no longer marks the chat's note as listened.": "Una nota de voz reenviada ahora se pone azul solo cuando la otra persona toca esa copia, y tocar una nota en el Historial del trabajo ya no la marca como escuchada en el chat.", "Voice notes: dragging and leaving": "Notas de voz: arrastrar y salir", "Dragging the dot while the chat updates no longer jumps to the end. A voice note playing in Job history stops when you leave, and shows who sent it.": "Arrastrar el punto mientras el chat se actualiza ya no salta al final. Una nota de voz en el Historial del trabajo se para al salir, y muestra quién la mandó.", "Download: once per tap, always": "Descargar: una vez por toque, siempre", "Download in the photo/video viewer now always saves one file per tap, even after a download that failed.": "Descargar en el visor de fotos/videos ahora siempre guarda un archivo por toque, aunque una descarga anterior haya fallado.", "Mic button back to normal": "Botón del micrófono normal", "After recording a voice note, the round mic button goes back to its normal size.": "Después de grabar una nota de voz, el botón redondo del micrófono vuelve a su tamaño normal.", "Very busy chats keep working": "Los chats muy largos siguen funcionando", "In a very long chat, reactions and the blue listened mark now always save (old messages move to the archive like with new messages).": "En un chat muy largo, las reacciones y la marca azul de escuchado ahora siempre se guardan (los mensajes viejos pasan al archivo como con los mensajes nuevos).", "Push never offers Saturday": "Posponer nunca ofrece sábado", "Push → the first choice is the next work day (on Friday it says Next work day = Sunday), and 2 days later also skips Shabbos/Yom Tov.": "Posponer → la primera opción es el siguiente día de trabajo (el viernes dice Siguiente día de trabajo = domingo), y 2 días después también salta Shabbos/Yom Tov.", "Needs you number is mint": "El número de Te necesita es verde menta", "The number on Needs you is mint now; it turns red only when something is late or urgent.": "El número en Te necesita ahora es verde menta; se pone rojo solo cuando algo está atrasado o urgente.", "'typing…' in one-to-one chats": "'escribiendo…' en chats de a dos", "In the Messages list, a one-to-one chat now shows just 'typing…' (or 'recording a voice note…'), like WhatsApp.": "En la lista de Mensajes, un chat de a dos ahora muestra solo 'escribiendo…' (o 'grabando un audio…'), como WhatsApp.", "5:30 bar: the date with capitals": "Barra de 5:30: la fecha con mayúsculas", "The After-5:30 bar and its question write a date properly (\"All to Sun, Nov 22\"); only tomorrow is small.": "La barra de después de las 5:30 y su pregunta escriben bien una fecha; solo mañana va en minúscula.", "Your voice note shows its real bars": "Tu nota de voz muestra sus barras reales", "A voice note you just sent shows its real sound bars right away (not made-up ones).": "Una nota de voz que acabas de mandar muestra sus barras de sonido reales enseguida.", "Workers: who drives, on the Today card": "Trabajadores: quién maneja, en la tarjeta de Hoy", "When the office drives a crew, the worker's big Today card now says Driver: Yossi (or Rocky). Try it shows the app as a worker.": "Cuando la oficina maneja una cuadrilla, la tarjeta grande de Hoy del trabajador ahora dice Chofer: Yossi (o Rocky). Probar muestra la app como un trabajador.", "Reply on a photo": "Responder en una foto", "A photo opened full screen from a chat now has the Reply button, like a video.": "Una foto abierta en pantalla completa desde un chat ahora tiene el botón Responder, como un video.", "New chat has Close": "Nuevo chat tiene Cerrar", "The New chat box now has a Close button.": "La ventana de Nuevo chat ahora tiene un botón Cerrar.", "Workers: More stays lit": "Trabajadores: Más se queda marcado", "For workers, on My week and All my jobs the More tab at the bottom now stays lit. Try it shows the app as a worker.": "Para los trabajadores, en Mi semana y Todos mis trabajos la pestaña Más de abajo ahora se queda marcada. Probar muestra la app como un trabajador.", "The right message after sending": "El mensaje correcto al enviar", "After sending something right away (a report, overtime, I arrived), the app keeps its own message (like Report sent) instead of replacing it with 'Everything was sent'.": "Después de enviar algo enseguida (un reporte, horas extra, Llegué), la app deja su propio mensaje (como Reporte enviado) en vez de cambiarlo por 'Todo se envió'.", "Spanish title stays after a voice note": "El título en español se queda", "For Spanish workers, the task name on top of the chat stays in Spanish after they send a voice note.": "Para los trabajadores en español, el nombre de la tarea arriba del chat se queda en español después de mandar una nota de voz.", "Only real dates": "Solo fechas reales", "The server now refuses dates that don't exist (like February 31).": "El servidor ahora no acepta fechas que no existen (como el 31 de febrero).", "Smaller voice notes shared from iPhone": "Notas de voz más livianas desde iPhone", "When an iPhone has to change an older voice note to share it, the file is now about a third of the size, and the voice still sounds clear.": "Cuando un iPhone tiene que convertir una nota de voz vieja para compartirla, el archivo ahora pesa como un tercio, y la voz se sigue oyendo clara."});
Object.assign(ES,{"Hold a reply to get its menu": "Mantén presionada una respuesta para su menú", "Holding a reply on its quoted part now opens the message menu (a short tap still jumps to the original message).": "Mantener presionada una respuesta sobre la parte citada ahora abre el menú del mensaje (un toque corto sigue llevando al mensaje original)."});
Object.assign(ES,{"No double notifications": "Sin avisos dobles", "If a phone signs up for notifications again (new code from the phone), its old sign-up is removed, so it never gets every notification twice. The test app no longer signs a phone out of the real app's notifications.": "Si un teléfono se vuelve a anotar para avisos, su anotación vieja se quita, así nunca recibe cada aviso dos veces. La app de prueba ya no saca un teléfono de los avisos de la app real."});
Object.assign(ES,{"Same voice note twice in a chat": "La misma nota de voz dos veces", "When the same voice note is in one chat twice (forwarded twice), each copy now has its own player: tapping one moves only its own dot.": "Cuando la misma nota de voz está dos veces en un chat (reenviada dos veces), cada copia ahora tiene su propio reproductor: al tocar una se mueve solo su punto."});
Object.assign(ES,{"No work today?": "¿No hubo trabajo hoy?", "You marked everyone ✗": "Marcaste a todos con ✗", "Yes – no work today": "Sí – no hubo trabajo hoy", "No – we worked, nobody came": "No – trabajamos, nadie vino", "Back to the report": "Volver al reporte", "Nobody came – looks like no work this day": "Nadie vino – parece que no hubo trabajo este día", "Crew report: everyone ✗ asks 'No work today?'": "Reporte: todos con ✗ pregunta '¿No hubo trabajo hoy?'", "When a crew leader marks every person ✗ and taps Send, the app asks 'No work today?'. Yes saves it as a no-work day (the report then says No work, nobody is told). No sends it as marked. Reports where everyone is ✗ (like Raúl's on Nov 15) now say 'Nobody came – looks like no work this day' and show — No work in the week list.": "Cuando un líder marca a todos con ✗ y toca Enviar, la app pregunta '¿No hubo trabajo hoy?'. Sí lo guarda como día sin trabajo (el reporte dice No hubo trabajo, no se avisa a nadie). No lo envía como está marcado. Los reportes donde todos tienen ✗ (como el de Raúl el 15 de nov.) ahora dicen 'Nadie vino – parece que no hubo trabajo este día' y muestran — Sin trabajo en la lista de la semana."});
Object.assign(ES,{"Every month on the 15th": "Cada mes el día 15", "Reminder today at ": "Recordatorio hoy a las ", "In 1 hour": "En 1 hora", "In 2 hours": "En 2 horas", "Later today": "Más tarde hoy", "Pick a time later today": "Elige una hora más tarde hoy", "Remind me then": "Recuérdame a esa hora", "Another day": "Otro día", "Office rent": "Renta de la oficina", "due the 15th": "se paga el 15", "Rocky gets it, with a reminder the day before at 9 AM. You only get told what happens.": "Rocky la recibe, con un recordatorio el día antes a las 9 AM. A ti solo te avisa lo que pasa.", "Not switched on yet – it starts when this goes to the main app.": "Todavía no está activado – empieza cuando esto pase a la app principal.", "This month": "Este mes", "Past months": "Meses anteriores", "Paid": "Pagado", "Late – not paid yet": "Atrasado – no pagado", "Pushed to": "Pasado al", "Not paid yet": "No pagado todavía", "Tap to mark paid": "Toca para marcar pagado", "Marked not paid": "Marcado como no pagado", "Marked paid": "Marcado pagado", "Marking a month paid here is silent – Rocky gets nothing.": "Marcar un mes pagado aquí es silencioso – Rocky no recibe nada.", "Try it – practice task for you": "Pruébalo – tarea de práctica para ti", "Making a practice rent task for you…": "Haciendo una tarea de práctica de la renta…", "Practice task is on your list – try Push → In 1 hour": "La tarea de práctica está en tu lista – prueba Pasar → En 1 hora", "Office rent: Rocky gets reminded": "Renta de la oficina: a Rocky se le recuerda", "Every month the office rent ($850, due the 15th) is a task on Rocky's list. He gets a reminder the day before at 9 AM (a Saturday moves to Friday) and again on the 15th if it isn't marked. Not paid by the end of the day? It turns red, and the next morning you both hear it. You get told when Rocky is reminded, pushes it, or pays it – nothing for you to do. Try it makes a practice rent task on your own list.": "Cada mes la renta de la oficina ($850, se paga el 15) es una tarea en la lista de Rocky. Recibe un recordatorio el día antes a las 9 AM (un sábado pasa al viernes) y otra vez el 15 si no está marcada. ¿No pagada al final del día? Se pone roja y a la mañana siguiente ambos reciben aviso. A ti te avisa cuando a Rocky se le recuerda, la pasa o la paga – no tienes que hacer nada. Pruébalo hace una tarea de práctica en tu propia lista.", "Office rent: push to later today": "Renta de la oficina: pasar a más tarde hoy", "Push on the rent task now also has 'In 1 hour', 'In 2 hours' and a time later today – a reminder comes at that time, so it doesn't have to wait for tomorrow. Try it makes a practice rent task and opens its Push.": "Pasar en la tarea de la renta ahora también tiene 'En 1 hora', 'En 2 horas' y una hora más tarde hoy – llega un recordatorio a esa hora, así no tiene que esperar a mañana. Pruébalo hace una tarea de práctica y abre su Pasar.", "Office rent page – mark past months paid": "Página de la renta – marcar meses pasados pagados", "More → Office rent shows this month and the past months. Tap a past month to mark it paid (silent – Rocky gets nothing). It also shows if this month is paid, pushed or late.": "Más → Renta de la oficina muestra este mes y los meses pasados. Toca un mes pasado para marcarlo pagado (silencioso – Rocky no recibe nada). También muestra si este mes está pagado, pasado o atrasado."});
Object.assign(ES,{"Before a Jewish holiday: you choose": "Antes de un día festivo judío: tú eliges", "When the next day is a Jewish holiday, the After-5:30 bar and Push ask: move to tomorrow (the holiday) or after the holiday – because sometimes Rocky works with the crew on a holiday. Shabbos still goes straight to Sunday.": "Cuando el día siguiente es un día festivo judío, la barra de después de las 5:30 y Posponer preguntan: pasar a mañana (el día festivo) o después del día festivo – porque a veces Rocky trabaja con la cuadrilla en un día festivo. Shabbos sigue pasando directo al domingo."});
Object.assign(ES,{"Forwarding is instant": "Reenviar es al instante", "Tapping a chat to forward to now takes you straight back to your chat with a small 'Forwarding…' note, then 'Forwarded – Rocky' (or My notes) when it is done. No more waiting on the list and tapping again.": "Al tocar un chat para reenviar, ahora vuelves enseguida a tu chat con una nota 'Reenviando…', y luego 'Reenviado – Rocky' (o Mis notas) cuando termina. Ya no hay que esperar en la lista ni tocar otra vez."});
Object.assign(ES,{"Back in Messages fixed": "Atrás en Mensajes arreglado", "In Messages, after picking Jobs, Chats or Groups: Back goes to All, the next Back goes to Today – it no longer closes the app.": "En Mensajes, después de elegir Trabajos, Chats o Grupos: Atrás vuelve a Todos, y el siguiente Atrás va a Hoy – ya no cierra la app."});
Object.assign(ES,{"No more 8 PM auto push": "Ya no se mueven solas a las 8 PM", "The app no longer moves your open tasks to the next day by itself at 8 PM. You decide: the bar after 5:30, or the morning question.": "La app ya no pasa sola tus tareas abiertas al día siguiente a las 8 PM. Tú decides: con la barra después de las 5:30, o con la pregunta de la mañana."});
Object.assign(ES,{"Undo is shorter": "Deshacer dura menos", "The Undo bar (after Done, moving tasks, I arrived…) now stays 3 seconds instead of 9.": "La barra de Deshacer (después de Listo, pasar tareas, Llegué…) ahora se queda 3 segundos en vez de 9."});
Object.assign(ES,{"Morning: bring late tasks to today": "En la mañana: pasar las tareas atrasadas a hoy", "If tasks from earlier days are still open (nobody moved them at 5:30), the first time you open the app in the morning it asks if you want to bring them to today. Yes moves them (with Undo for 3 seconds), Not now leaves them. It asks once a day. Only for Yossi, Rocky and Ashley, each for their own tasks. (To see it now: More → App maintenance → Preview the morning question.)": "Si quedan tareas abiertas de días anteriores (nadie las pasó a las 5:30), la primera vez que abres la app en la mañana te pregunta si quieres pasarlas a hoy. Sí las pasa (con 3 segundos para Deshacer), Ahora no las deja. Pregunta una vez al día. Solo para Yossi, Rocky y Ashley, cada uno con sus propias tareas. (Para verlo ahora: Más → Mantenimiento de la app → Ver la pregunta de la mañana.)"});
Object.assign(ES,{"After 5:30: move to tomorrow": "Después de las 5:30: pasar a mañana", "From 5:30 PM, Tasks shows a bar with how many of today's (and late) tasks are still open, and each one gets a small → Tomorrow button. It asks you first, then you have 3 seconds to Undo. It goes to the next work day (Friday goes to Sunday). Only for Yossi, Rocky and Ashley. (To see it before 5:30: More → App maintenance → Preview after 5:30.)": "Desde las 5:30 PM, Tareas muestra una barra con cuántas tareas de hoy (y atrasadas) siguen abiertas, y cada una tiene un botoncito → Mañana. Primero te pregunta, y luego tienes 3 segundos para Deshacer. Pasa al siguiente día de trabajo (el viernes pasa al domingo). Solo para Yossi, Rocky y Ashley. (Para verlo antes de las 5:30: Más → Mantenimiento de la app → Ver cómo se ve después de las 5:30.)", "It's after 5:30": "Ya pasaron las 5:30", "task still open": "tarea todavía abierta", "tasks still open": "tareas todavía abiertas", "All to": "Todo para", "Not forwarded": "No se reenvió", "Move": "Mover", "Move all": "Mover todo", "Move to which day?": "¿Para qué día?", "The next day is a Jewish holiday.": "El día siguiente es un día festivo judío.", "Tomorrow – the holiday": "Mañana – el día festivo", "After the holiday": "Después del día festivo", "Try it": "Probar", "Got it": "Entendido", "next": "siguiente", "left": "quedan", "left – the last one": "queda – la última", "typing…": "escribiendo…", "recording a voice note…": "grabando un audio…", "Next work day": "Siguiente día de trabajo", "Forwarded to My notes": "Reenviado a Mis notas", "Good morning": "Buenos días", "No late tasks right now": "No hay tareas atrasadas ahora", "task from before is still open. Bring it to today?": "tarea de antes sigue abierta. ¿Pasarla a hoy?", "tasks from before are still open. Bring them to today?": "tareas de antes siguen abiertas. ¿Pasarlas a hoy?", "Yes, bring all to today": "Sí, pasar todas a hoy", "Yes, bring it to today": "Sí, pasarla a hoy", "Preview the morning question (only you)": "Ver la pregunta de la mañana (solo tú)", "Showing it like after 5:30 – only on your phone": "Se muestra como después de las 5:30 – solo en tu teléfono", "Back to the real time": "De vuelta a la hora real", "Stop the after-5:30 preview": "Parar la vista de después de las 5:30", "Preview after 5:30 (only you)": "Ver cómo se ve después de las 5:30 (solo tú)", "Yes, move all": "Sí, pasar todas", "Yes, move it": "Sí, pasarla"});
Object.assign(ES,{"Older voice notes share on iPhone": "Las notas de voz viejas se comparten en iPhone", "On an iPhone, sharing an older voice note that was recorded on an Android phone now turns it into a normal iPhone sound file (m4a) first, so WhatsApp and other apps can play it.": "En un iPhone, al compartir una nota de voz vieja grabada en un Android, ahora se convierte primero en un archivo de sonido normal de iPhone (m4a), para que WhatsApp y otras apps la puedan tocar."});
Object.assign(ES,{"Voice notes send faster": "Las notas de voz se envían más rápido", "A voice note now shows as sent sooner: the server answers right away with just that chat, and the rest of the app updates a moment later. Same sound quality.": "Una nota de voz ahora sale como enviada más pronto: el servidor contesta enseguida solo con ese chat, y el resto de la app se actualiza un momento después. La misma calidad de sonido."});
Object.assign(ES,{"Task name on top of the chat": "El nombre de la tarea arriba del chat", "Inside a job chat, the top now shows the task you are chatting about, with the job and address under it.": "Dentro de un chat de trabajo, arriba ahora se ve la tarea de la que estás hablando, con el trabajo y la dirección abajo.", "Moving someone's task to you": "Pasarte la tarea de otra persona", "When you send Rocky's (or Ashley's) task to yourself, the note in that chat now comes from them, and it shows as a new message in your Messages.": "Cuando te pasas la tarea de Rocky (o de Ashley), la nota en ese chat ahora sale de ellos, y aparece como mensaje nuevo en tus Mensajes."});
Object.assign(ES,{"Mint pop-ups and Share fixed": "Avisos verde menta y Compartir arreglado", "The small messages that pop up (like Starred, Copied or Saved) are now the mint bubble instead of black. Holding a voice note and tapping Share now opens the phone's share list (WhatsApp, text, email…) (it was refused because of how the voice file was labelled).": "Los mensajitos que aparecen (como Destacado, Copiado o Guardado) ahora son la burbuja verde menta en vez de negra. Si mantienes presionada una nota de voz y tocas Compartir, ahora se abre la lista del teléfono para compartir (WhatsApp, mensaje, correo…) (antes el teléfono la rechazaba por cómo estaba marcado el archivo de voz)."});
Object.assign(ES,{"Blue mic in the chat list": "Micrófono azul en la lista de chats", "In Messages, the little mic next to a voice note turns blue once it was listened to: their voice note after you play it, and yours after the person you sent it to played it. Not listened yet stays mint.": "En Mensajes, el micrófono pequeño al lado de una nota de voz se pone azul cuando ya se escuchó: la nota de otra persona después de que tú la escuches, y la tuya después de que la persona a quien se la mandaste la escuchó. Si todavía no se escuchó, se queda verde menta."});
Object.assign(ES,{"Voice notes and chats fixed": "Notas de voz y chats arreglados", "A voice note turns blue the first time you listen, its dot always moves, and the next one always plays by itself. Pausing or dragging keeps its place. A worker's message in a job chat gets blue ticks when both Yossi and Rocky saw it (2 grey ticks once it reached Yossi, Rocky or Ashley). Opening or leaving a chat shows new messages right away, Cancel on \"Done?\" goes back to the chat, a message still sending shows the clock, starring shows the star at once, and something forwarded to your own notes shows as new.": "Una nota de voz se pone azul la primera vez que la escuchas, su punto siempre se mueve y la siguiente siempre suena sola. Pausar o arrastrar guarda su lugar. El mensaje de un trabajador en el chat del trabajo tiene palomitas azules cuando Yossi y Rocky lo vieron (2 palomitas grises cuando le llegó a Yossi, Rocky o Ashley). Abrir o salir de un chat muestra los mensajes nuevos enseguida, Cancelar en \"¿Listo?\" regresa al chat, un mensaje que se está enviando muestra el reloj, destacar muestra la estrella enseguida, y lo que reenvías a tus notas sale como nuevo.", "not opened yet": "todavía no lo abre"});
Object.assign(ES,{'Listened':'Escuchado'});
Object.assign(ES,{"Voice notes like WhatsApp": "Notas de voz como WhatsApp", "A voice note you did not listen to yet has a green dot and mic; after you listen they turn blue. Your own voice notes turn blue when the other person listened. While it plays, the picture becomes a 1× / 1.5× / 2× button. Drag the dot with your finger to go back or forward. One tap on another voice note starts it right away and stops the first one where it was.": "Una nota de voz que todavía no escuchaste tiene el punto y el micrófono verdes; después de escucharla se ponen azules. Tus propias notas de voz se ponen azules cuando la otra persona las escuchó. Mientras suena, la foto se cambia por un botón 1× / 1.5× / 2×. Arrastra el punto con el dedo para regresar o adelantar. Un toque en otra nota de voz la empieza enseguida y deja la primera donde estaba."});
Object.assign(ES,{"Voice notes play one after another": "Las notas de voz suenan una tras otra", "When voice notes are right under each other (from anyone), the next one plays by itself when one ends – like WhatsApp. A text, photo or video in between stops it, and leaving the chat stops it.": "Cuando hay notas de voz una debajo de otra (de cualquier persona), la siguiente suena sola cuando termina una – como WhatsApp. Un texto, foto o video en medio la detiene, y salir del chat la detiene."});
Object.assign(ES,{"Blue ticks in My notes": "Palomitas azules en Mis notas", "Your own notes now get the blue double tick as soon as they are saved – the same look as a message someone has read.": "Tus propias notas ahora tienen las dos palomitas azules en cuanto se guardan – igual que un mensaje que alguien ya leyó.", "Seen": "Visto"});
Object.assign(ES,{'Downloading…':'Descargando…','Saved':'Guardado'});
Object.assign(ES,{'Wait until it is loaded':'Espera a que cargue','Could not save it':'No se pudo guardar'});
Object.assign(ES,{"Full-screen video like WhatsApp": "Video en pantalla completa como WhatsApp", "Open a video in a chat and tap it once: on top you see who sent it and when, with Download and Forward. At the bottom: the time on the left of the line, the length on the right, the speed (1× 1.5× 2×) on the same line, and a Reply box. Photos opened full screen have the same top bar (Download, Forward). Hold the video for all the options.": "Abre un video en un chat y tócalo una vez: arriba ves quién lo envió y cuándo, con Descargar y Reenviar. Abajo: el tiempo a la izquierda de la línea, el largo a la derecha, la velocidad (1× 1.5× 2×) en la misma línea, y una caja para Responder. Las fotos en pantalla completa tienen la misma barra arriba (Descargar, Reenviar). Mantén presionado el video para todas las opciones.", "Wait until the video is loaded": "Espera a que cargue el video", "Saved to the phone": "Guardado en el teléfono", "Download": "Descargar"});
Object.assign(ES,{"Back in Messages goes to All first": "En Mensajes, Atrás va primero a Todos", "In Messages, when you are on Jobs, Chats or Groups, Back takes you to All. Press Back again to leave Messages.": "En Mensajes, cuando estás en Trabajos, Chats o Grupos, Atrás te lleva a Todos. Toca Atrás otra vez para salir de Mensajes."});
Object.assign(ES,{"Several videos at once + more fixes": "Varios videos a la vez + más arreglos", "Sending 2 or more videos (or photos) together: each one keeps showing with its own % until it is sent, and a video is never saved twice. Also: Slide to Done works again right away after closing the box, the worker card says \"Driver:\", the chat list puts the newest messages on top, \"Waiting to send\" is red, no car emoji in the schedule driver list, and many small Spanish and small-phone fixes.": "Al enviar 2 o más videos (o fotos) juntos: cada uno se sigue viendo con su propio % hasta que se envía, y un video nunca se guarda dos veces. También: Desliza a Listo funciona de nuevo enseguida después de cerrar la ventana, la tarjeta del trabajador dice \"Chofer:\", la lista de chats pone los mensajes más nuevos arriba, \"Esperando para enviar\" está en rojo, ya no hay emoji de carro en la lista de choferes del horario, y muchos arreglos pequeños de español y de teléfonos pequeños."});
Object.assign(ES,{"Typing in the chat list + clearer mute icon": "Escribiendo en la lista de chats + ícono de silencio más claro", "Messages now shows \"Juan is typing…\" / \"recording…\" right on the chat row. A muted chat has a bigger, clearer bell-with-a-line icon.": "Mensajes ahora muestra \"Juan está escribiendo…\" / \"grabando…\" en la fila del chat. Un chat silenciado tiene un ícono de campana tachada más grande y claro.", "One Back closes the app": "Un Atrás cierra la app", "On Today with nothing open, one tap on Back closes the app (no more \"press Back again\"). From another tab, Back first goes to Today – like WhatsApp.": "En Hoy, sin nada abierto, un toque en Atrás cierra la app (ya no hay \"presiona Atrás otra vez\"). Desde otra pestaña, Atrás primero va a Hoy – como WhatsApp.", "Swipe to reply": "Desliza para responder", "In a chat, swipe a message to the right to reply to it – like WhatsApp.": "En un chat, desliza un mensaje a la derecha para responderlo – como WhatsApp.", "\"Typing…\" and \"recording…\"": "\"Escribiendo…\" y \"grabando…\"", "At the top of a chat and on its row in Messages you see when someone is typing or recording a voice note. New messages also show up within a few seconds while the chat is open.": "Arriba en un chat y en su fila en Mensajes ves cuando alguien está escribiendo o grabando una nota de voz. Los mensajes nuevos también aparecen en pocos segundos mientras el chat está abierto.", "Pin chats": "Fijar chats", "Hold a chat in Messages → Pin chat. Up to 3 chats stay at the top.": "Mantén presionado un chat en Mensajes → Fijar chat. Hasta 3 chats se quedan arriba.", "Mute a chat": "Silenciar un chat", "Hold a chat in Messages → Mute 8 hours, 1 week or always. No notifications from it (an @mention still comes). Hold it again to unmute.": "Mantén presionado un chat en Mensajes → Silenciar 8 horas, 1 semana o siempre. No llegan notificaciones de él (una @mención sí llega). Mantenlo presionado otra vez para quitar el silencio.", "Hold a message → Star. All your starred messages are behind the ⭐ next to the search in Messages – tap one to jump to it.": "Mantén presionado un mensaje → Destacar. Todos tus mensajes destacados están en la ⭐ junto a la búsqueda en Mensajes – toca uno para ir a él.", "Link previews": "Vista previa de enlaces", "A message with a web link shows a small card with the page title and picture. Links can be tapped.": "Un mensaje con un enlace muestra una tarjeta pequeña con el título y la foto de la página. Los enlaces se pueden tocar.", "Messages: All first": "Mensajes: Todos primero", "Messages now opens on All – every chat together, newest on top. Tap Chats, Jobs or Groups to see only those.": "Mensajes ahora abre en Todos – todos los chats juntos, el más nuevo arriba. Toca Chats, Trabajos o Grupos para ver solo esos.", "Swipe down closes – no surprise refresh": "Deslizar hacia abajo cierra – sin recargas sorpresa", "Pulling down no longer reloads the whole app. Swipe down on an open video or photo goes back to the chat. The app still updates by itself.": "Jalar hacia abajo ya no recarga toda la app. Deslizar hacia abajo en un video o foto abierta regresa al chat. La app se sigue actualizando sola.", "Smaller, cleaner app": "App más pequeña y limpia", "Old screens and styles nobody uses anymore were taken out, so the app is smaller and opens faster. Nothing you use was changed.": "Se quitaron pantallas y estilos viejos que nadie usa, así la app es más pequeña y abre más rápido. Nada de lo que usas cambió.", "Hold a video like a photo": "Mantén presionado un video como una foto", "Hold an open video: you get the same menu as in the chat (react, reply, forward, share, delete) – not the phone's video menu. Holding a tall video in the chat opens the menu on top of the video, so it never hides behind it.": "Mantén presionado un video abierto: sale el mismo menú que en el chat (reaccionar, responder, reenviar, compartir, borrar) – no el menú de video del teléfono. En un video alto en el chat, el menú abre encima del video, así nunca queda escondido.", "Voice notes send faster": "Las notas de voz se envían más rápido", "Voice notes now go to the server in one trip instead of three – about twice as fast. The sound quality is exactly the same.": "Las notas de voz ahora llegan al servidor en un solo viaje en vez de tres – casi el doble de rápido. La calidad del sonido es exactamente igual.", "Weather in mint": "El clima en verde menta", "The weather icons now use the same mint line style as the rest of the app (sun, clouds, rain, snow).": "Los íconos del clima ahora usan el mismo estilo de líneas verde menta que el resto de la app (sol, nubes, lluvia, nieve).", "Weather follows new jobs": "El clima sigue los trabajos nuevos", "A new job or task with an address in a new town shows up in the weather by itself – also when the address has no \"NY\" in it.": "Un trabajo o tarea nueva con dirección en un pueblo nuevo aparece sola en el clima – también cuando la dirección no tiene \"NY\".", "Small fixes": "Arreglos pequeños", "Chat list shows the mint photo/video icons again · schedule changes say what changed (time, job, address, note) · small iPhones (SE) fit the login and the Done button · iPhone videos are lighter (photos stay sharp 4K) · iPhone no longer downloads videos on mobile data · snow page title shows once · new copy and arrow icons.": "La lista de chats muestra otra vez los íconos verde menta de foto/video · los cambios de horario dicen qué cambió (hora, trabajo, dirección, nota) · en iPhones pequeños (SE) caben la entrada y el botón Listo · los videos del iPhone pesan menos (las fotos siguen nítidas en 4K) · el iPhone ya no descarga videos con datos móviles · el título de la página de nieve sale una vez · íconos nuevos de copiar y flecha.", "Group info like WhatsApp": "Información del grupo como WhatsApp", "Tap the group name at the top of a group chat: see everyone in the group (office = group admin), all photos, videos and files, add or remove people, and delete the group. Removed people's old messages stay, with their name in grey. Only the office can change a group.": "Toca el nombre del grupo arriba en un chat de grupo: ves a todos en el grupo (oficina = administrador), todas las fotos, videos y archivos, agregas o quitas personas, y borras el grupo. Los mensajes viejos de las personas quitadas se quedan, con su nombre en gris. Solo la oficina puede cambiar un grupo.", "Removed workers in groups": "Trabajadores quitados en los grupos", "When a worker is removed, he leaves the group list but his old messages stay – his name shows grey, like WhatsApp.": "Cuando se quita a un trabajador, sale de la lista del grupo pero sus mensajes viejos se quedan – su nombre sale en gris, como WhatsApp.", "\"Today at a glance\" removed": "Se quitó \"Hoy de un vistazo\"", "The Today at a glance card is gone from Home – everything it showed is already in Job sites and the chats.": "La tarjeta Hoy de un vistazo ya no está en Inicio – todo lo que mostraba ya está en Obras y en los chats.", "Waiting photos and voice notes stay in the chat": "Las fotos y notas de voz en espera se quedan en el chat", "With no signal, the photo, video or voice note stays in the chat with \"Waiting for signal – sends by itself\", even after closing the app. It disappears from there when it is sent.": "Sin señal, la foto, el video o la nota de voz se queda en el chat con \"Esperando señal – se envía sola\", aunque cierres la app. Desaparece de ahí cuando se envía.", "Long chats open faster": "Los chats largos abren más rápido", "Long chats show the newest 60 messages first. Tap \"Earlier messages\" at the top to see more.": "Los chats largos muestran primero los 60 mensajes más nuevos. Toca \"Mensajes anteriores\" arriba para ver más.", "More mint look": "Más verde menta", "The last old-style icons and colors are now mint: close buttons, Offline, Pick people, arrows, badges and the calendar.": "Los últimos íconos y colores viejos ahora son verde menta: botones de cerrar, Sin conexión, Escoger personas, flechas, insignias y el calendario.", "Old worker tasks close by themselves": "Las tareas viejas de los trabajadores se cierran solas", "Worker tasks from before today that were still open are closed automatically (same as the 6 PM close). Office tasks are not touched.": "Las tareas de trabajadores de antes de hoy que seguían abiertas se cierran solas (igual que el cierre de las 6 PM). Las tareas de la oficina no se tocan.", "See who reacted": "Ver quién reaccionó", "Tap the reactions under a message: a list opens from the bottom, like WhatsApp – All or one emoji at a time. Tap your own to remove it.": "Toca las reacciones debajo de un mensaje: se abre una lista desde abajo, como WhatsApp – Todas o un emoji a la vez. Toca la tuya para quitarla.", "Shabbos time on the calendar": "Hora de Shabbos en el calendario", "Every Friday on the calendar shows when Shabbos starts in Monroe (candle lighting). Tap a Friday to see it.": "Cada viernes en el calendario muestra cuándo empieza Shabbos en Monroe (encendido de velas). Toca un viernes para verlo.", "Estimates: nothing is required": "Presupuestos: nada es obligatorio", "Name, address, email and phone are all optional now – fill in what you have and save.": "Nombre, dirección, correo y teléfono ahora son opcionales – llena lo que tengas y guarda.", "Translate messages": "Traducir mensajes", "Hold a message → Translate (Spanish ⇄ English), free. Spanish workers now also see your task titles and notes in Spanish.": "Mantén presionado un mensaje → Traducir (español ⇄ inglés), gratis. Los trabajadores en español ahora también ven los títulos y notas de tus tareas en español.", "Date and job on every photo": "Fecha y trabajo en cada foto", "Photos from the app camera get a small date · time · job stamp in the corner – proof for the customer.": "Las fotos de la cámara de la app llevan una marca pequeña de fecha · hora · trabajo en la esquina – prueba para el cliente.", "Done button in the job chat": "Botón de Listo en el chat del trabajo", "Nothing is lost with no signal": "Nada se pierde sin señal", "Videos, voice notes, files and photos sent with no signal are saved on the phone (even if the app is closed) and send by themselves when the signal is back. Long chats keep their old messages in an archive (Search all history finds them).": "Los videos, notas de voz, archivos y fotos enviados sin señal se guardan en el teléfono (aunque la app esté cerrada) y se envían solos cuando vuelve la señal. Los chats largos guardan sus mensajes viejos en un archivo (Buscar en todo el historial los encuentra).", "Smarter notifications": "Notificaciones más inteligentes", "On a day off (Saturday / Yom Tov) the app is quiet unless people are working (working Saturday, snow, or a schedule / task for the next day) – then everyone gets them, you too. A worker's message or Done now goes to whoever made the task and the office people already in that chat – not all 3 phones. \"Your job was changed\" now says what changed.": "En un día libre (sábado / Yom Tov) la app está callada a menos que haya gente trabajando (sábado de trabajo, nieve, o un horario / tarea para el día siguiente) – entonces a todos les llegan, a ti también. El mensaje o Listo de un trabajador ahora va a quien hizo la tarea y a la gente de la oficina que ya está en ese chat – no a los 3 teléfonos. \"Tu trabajo cambió\" ahora dice qué cambió.", "Worker screen cleaner": "Pantalla del trabajador más limpia", "Workers see WHAT to do as the big line (job name small above), the address and Go even when only the job has one, all alerts under the job, a Phones tab to call the office and their crew, weather, and Undo after \"I arrived\". Install / PIN tips moved under the job.": "Los trabajadores ven QUÉ hacer en la línea grande (el nombre del trabajo pequeño arriba), la dirección e Ir aunque solo el trabajo la tenga, todos los avisos debajo del trabajo, una pestaña de Teléfonos para llamar a la oficina y a su cuadrilla, el clima, y Deshacer después de \"Llegué\". Los consejos de instalar / PIN se movieron debajo del trabajo.", "Safety fixes": "Arreglos de seguridad", "Files can't run inside the app, worker PIN guessing is blocked, removed workers get nothing, Forward only for files of that chat, the AI key can't change PINs, worker PINs show only to you. Rocky can also approve a Forgot PIN.": "Los archivos no pueden ejecutarse dentro de la app, adivinar el PIN de un trabajador está bloqueado, los trabajadores quitados no reciben nada, Reenviar solo para archivos de ese chat, la clave de IA no puede cambiar PINs, los PINs de los trabajadores solo te salen a ti. Rocky también puede aprobar un PIN olvidado.", "Mint everywhere": "Verde menta en todas partes", "Home tiles and Needs you in mint, one green, no beige, mint focus on text boxes, the app's icons instead of emojis in many more places, Back goes to the right page.": "Los cuadros de Inicio y Te necesita en verde menta, un solo verde, nada de beige, borde verde menta al escribir, los íconos de la app en vez de emojis en muchos más lugares, Atrás va a la página correcta.", "Smoother on iPhone and Samsung": "Más suave en iPhone y Samsung", "Voice notes never play twice, the camera comes back after a call, chats don't download when the phone sleeps, scrolling never waits for the swipe, Samsung keyboard keeps the chat header, iPhone log-in always fits.": "Las notas de voz nunca suenan dos veces, la cámara regresa después de una llamada, los chats no descargan cuando el teléfono duerme, el desplazamiento nunca espera al deslizamiento, el teclado de Samsung deja ver el encabezado del chat, la entrada del iPhone siempre cabe.", "Messages: Jobs · Chats · Groups": "Mensajes: Trabajos · Chats · Grupos", "Under the search box in Messages: Jobs (all the job chats), Chats (direct messages) and Groups. The small number shows new messages in each. Search still looks through everything.": "Debajo de la búsqueda en Mensajes: Trabajos (todos los chats de trabajo), Chats (mensajes directos) y Grupos. El número pequeño muestra los mensajes nuevos de cada uno. La búsqueda sigue buscando en todo.", "Emojis open right away": "Los emojis abren de inmediato", "Tap the smiley in a chat and the app's own emoji panel opens at once (Recent, Smileys, Hands, Work, Weather, Signs) – no more note about the keyboard. Tap the keyboard icon to type again. Holding a message → ＋ opens the same panel to react.": "Toca la carita en un chat y el panel de emojis de la app abre de inmediato (Recientes, Caritas, Manos, Trabajo, Clima, Señales) – ya no sale la nota del teclado. Toca el ícono del teclado para escribir otra vez. Mantener presionado un mensaje → ＋ abre el mismo panel para reaccionar.", "Back goes to the camera": "Atrás regresa a la cámara", "Not happy with the picture? The phone's Back now takes you back to the camera to take another one. Press Back again to leave the camera.": "¿No te gustó la foto? El Atrás del teléfono ahora te regresa a la cámara para tomar otra. Presiona Atrás otra vez para salir de la cámara.", "iPhone: sharper camera + flashlight": "iPhone: cámara más nítida + linterna", "On iPhone the app camera now uses the sharpest picture the phone gives (4K), so photos and zoom are clear, and the flashlight button works on iPhones that allow it (iOS 17.4 and newer). Videos stay a normal size.": "En iPhone la cámara de la app ahora usa la imagen más nítida que da el teléfono (4K), así las fotos y el zoom se ven claros, y el botón de linterna funciona en los iPhone que lo permiten (iOS 17.4 y más nuevos). Los videos quedan de tamaño normal.", "muted": "silenciado", "Delete this video?": "¿Borrar este video?", "Delete this photo?": "¿Borrar esta foto?"});
Object.assign(ES,{'Final polish':'Últimos detalles','The sliders are smoother (the page no longer moves while you slide, and a quick second try works), notifications say "Started", the done box says "Listo" in Spanish, the schedule and chats are mint, warnings are red again, and What\'s new shows worker changes as the worker sees them.':'Los deslizadores funcionan mejor (la pantalla ya no se mueve al deslizar y un segundo intento rápido funciona), las notificaciones dicen "Empezado", la ventana de terminar dice "Listo", el horario y los chats son verde menta, los avisos vuelven a ser rojos, y Novedades muestra los cambios de los trabajadores como ellos los ven.'});
Object.assign(ES,{'Slide to finish the job':'Desliza para terminar el trabajo','Workers: on Today, the big Done button is now a slide – drag the round button all the way to the right, then add a note and press Done. Undo is there for a few seconds.':'Trabajadores: en Hoy, el botón grande de Listo ahora se desliza – arrastra el botón redondo hasta la derecha, luego agrega una nota y toca Listo. Puedes deshacerlo por unos segundos.'});
Object.assign(ES,{'Slide to Done':'Desliza hasta Listo','"Halfway" is now "Started". Tap Started, then slide it all the way to Done – a quick tap can\'t mark it done by mistake. Slide back to undo, and right after Done there is an Undo button for a few seconds. All in mint.':'"A medias" ahora es "Empezado". Toca Empezado y luego deslízalo hasta Listo – un toque rápido no lo marca como listo por error. Desliza de regreso para deshacer, y después de Listo hay un botón de Deshacer por unos segundos. Todo en verde menta.'});
Object.assign(ES,{'Messages, photos, videos':'Mensajes, fotos, videos','Photos are in the chat':'Las fotos están en el chat','The camera button is gone from the task cards – the big Chat button has messages, photos, videos and reactions, all in one place.':'Se quitó el botón de cámara de las tarjetas – el botón grande de Chat tiene mensajes, fotos, videos y reacciones, todo en un lugar.'});
Object.assign(ES,{'Big Chat button on every task':'Botón grande de Chat en cada tarea','Every task card – yours and the workers\' – now has a big Chat button with the last message, the same as the job card on Today.':'Cada tarjeta de tarea – la tuya y la de los trabajadores – ahora tiene un botón grande de Chat con el último mensaje, igual que la tarjeta del trabajo en Hoy.'});
Object.assign(ES,{'All mint':'Todo en verde menta','The Sunday "Are you working today?" card and the last yellow, orange and plain-green spots are now mint. A task page shows its day only once.':'La tarjeta del domingo "¿Trabajas hoy?" y los últimos detalles amarillos, naranjas y verdes ahora son verde menta. La página de una tarea muestra el día solo una vez.'});
Object.assign(ES,{'Started':'Empezado','Started – not finished yet':'Empezado – todavía no termino','Started and Done':'Empezado y Listo','"Halfway" is now "Started". On a task, tap or swipe right: Started, then Done. Swipe left to go back. All in mint.':'"A medias" ahora es "Empezado". En una tarea, toca o desliza a la derecha: Empezado, luego Listo. Desliza a la izquierda para regresar. Todo en verde menta.','The job chat shows a "Done?" button on top – tap it, add a note and press Done.':'El chat del trabajo muestra un botón "¿Listo?" arriba – tócalo, agrega una nota y toca Listo.'});
Object.assign(ES,{'Phones':'Teléfonos'});
Object.assign(ES,{'Phones tab for everyone':'Pestaña de teléfonos para todos','Workers now have a Phones tab at the bottom, like the office: everyone in their crew first (Prospect crews see their crew, daily workers see the whole daily crew), then the office.':'Ahora los trabajadores tienen una pestaña de Teléfonos abajo, como la oficina: primero su cuadrilla, después la oficina.'});
Object.assign(ES,{'Cleaner worker screen':'Pantalla más limpia','The driver now shows with the app\'s own van icon, the "+1 more job today" card is mint, and the big Call the office button is gone – workers call from the Phones tab.':'El chofer ahora sale con el ícono de camioneta de la app, la tarjeta "+1 trabajo más hoy" es verde menta, y se quitó el botón grande de Llamar a la oficina – llaman desde la pestaña de Teléfonos.'});
Object.assign(ES,{'New in the app':'Nuevo en la app'});
Object.assign(ES,{'Came':'Vinieron','Overtime':'Horas extra','None':'Ninguna','Activities':'Actividades','of':'de','done':'listas','Note':'Nota','Report summary on Today':'Resumen del reporte en Hoy','Crew leaders: after you send the daily report, Today shows what you sent – who came, who did not, overtime and activities. Tap ✎ to fix it.':'Encargados: después de mandar el reporte diario, Hoy muestra lo que mandaste – quién vino, quién no, horas extra y actividades. Toca ✎ para arreglarlo.'});
Object.assign(ES,{'Job chat':'Chat del trabajo','Write to the office about this job':'Escríbele a la oficina sobre este trabajo','new message':'nuevo','new messages':'nuevos','Job chat on the job card':'Chat del trabajo en la tarjeta del trabajo','Workers: today\'s job card has a "Job chat" button with the last message and how many are new. One tap opens the right chat.':'Trabajadores: la tarjeta del trabajo de hoy tiene un botón "Chat del trabajo" con el último mensaje y cuántos son nuevos. Un toque abre el chat correcto.','Cleaner and clearer everywhere':'Más limpio y claro en todas partes','Bigger text no longer hides the chat typing box, job chats are named by the job, Spanish words are the same everywhere, holidays in Spanish, and many small fixes for small phones and iPhones.':'Las letras grandes ya no esconden la caja para escribir, los chats de trabajo llevan el nombre del trabajo, las palabras en español son iguales en todas partes, los días festivos en español, y muchos arreglos pequeños para teléfonos pequeños y iPhone.'});

function subUI(){return !!(document.getElementById('mmenu')||document.querySelector('.chatsheet .attcard2,.chatsheet .emopanel,.chatsheet .replybar,.chatsheet .recbar2,.chatsheet .recprev')||[].some.call(document.querySelectorAll('.chatsheet .tagbox'),function(n){return n.style.display!=='none';}));}
function syncHist(){try{
  var st=history.state||{},s=navSnap(),sh=!!document.getElementById('scrim'),vw=!!document.getElementById('viewer'),sub=sh&&subUI();
  if(!st.sam){history.replaceState({sam:1,pad:1},'');st=history.state;}            // first open: exit pad under everything
  if(!st.pad&&(s.k==='home'||s.k==='login|')&&!sh&&!vw){navOwn++;history.back();return;} // back on Today with nothing open: step down to the pad, so the next Back closes the app
  if(st.pad){if((s.k==='home'||s.k==='login|')&&!sh&&!vw)return;s.d=1;history.pushState(s,'');st=s;}    // Today with nothing open sits on the pad itself, so one Back closes the app (like WhatsApp)
  else if((st.viewer&&!vw)||(st.sheet&&!sh)||(st.sub&&!sub&&!vw)||(sh&&st.sheet&&!st.viewer&&(st.rd||0)>RET.length)){ // a sheet/viewer/step was closed by a button
    if(st.k===s.k&&!navRepl){navOwn++;history.back();return;}                         // same screen: drop its entry (popstate re-syncs)
    s.d=(st.d||1)+1;s.from=st.k;history.replaceState(s,'');st=s;                       // went to a new screen from a sheet: it takes the sheet's place
  }

    if(st.seg&&s.k!=='chats'){S.chatSeg='all';navOwn++;history.back();return;} // left Messages while on Jobs/Chats/Groups: take that step off first, so Back is never a dead press
    // Back goes to the page before, not through every screen: going to the parent = step back; side by side screens (tabs, job → other job) replace each other.
    var pk=function(k){var v=String(k||'').split('|')[0];return (v==='home'||v==='login'||!v)?'':(v==='jobhist'?'jobs':v==='snowdrv'?'snow':v==='estone'?'est':v==='est'?'more':v==='myjobs'||v==='week'||v==='cal'||v==='sites'?'more':'home');};
    if(!navRepl&&st.me===s.me&&st.from&&s.k===st.from){navOwn++;history.back();return;}
    if(!navRepl&&st.me===s.me&&pk(s.k)&&pk(s.k)===pk(st.k)&&st.k!=='need')navRepl=true;   // opened from "Needs you": Back returns to it
    if(navRepl||st.me!==s.me){s.d=st.me!==s.me?1:st.d;s.from=st.from;history.replaceState(s,'');}
    else{history.replaceState(Object.assign({},st,{y:NAV_Y}),'');s.d=(st.d||1)+1;s.from=st.k;history.pushState(s,'');}
    st=s;
  }
  else{s.d=st.d;s.from=st.from;s.sheet=st.sheet;s.viewer=st.viewer;s.rd=st.rd;s.sub=st.sub;s.seg=st.seg;history.replaceState(s,'');st=s;}  // same screen: just keep tab/day current
  navRepl=false;
  if(sh&&!st.sheet&&!st.viewer){st=Object.assign({},st,{sheet:1,rd:RET.length,sub:0});history.pushState(st,'');}
  else if(sh&&st.sheet&&!st.viewer&&!st.sub&&(st.rd||0)<RET.length){st=Object.assign({},st,{rd:RET.length});history.pushState(st,'');} // one more step inside (chat → task → chat): its own Back step, pushed while the finger is on the screen
  if(sub&&!st.sub&&!st.viewer){st=Object.assign({},st,{sub:1});history.pushState(st,'');}
  if(vw&&!st.viewer){st=Object.assign({},st,{viewer:1});history.pushState(st,'');}
}catch(e){}}

  navRepl=true;fallback();}
window.addEventListener('popstate',function(e){
  if(navOwn>0){navOwn--;syncHist();return;}                 // our own history.back()
  var st=e.state||{};

  if(window.MM_CLOSE&&document.getElementById('mmenu')){MM_CLOSE();queueHist();return;} // a held message → only let go of it, stay in the chat
  if(window.RV_BACK&&document.querySelector('.rvwrap')){var rb=RV_BACK;RV_BACK=null;rb();queueHist();return;} // looking at a picture before sending → back to the camera, not out of it
  var shc=document.getElementById('shcard');if(shc){shc.remove();queueHist();return;} // Share card → close only it, stay in the chat
  if(closeViewer()){queueHist();return;}                     // 1) viewer open → close only the viewer
  var dd=document.getElementById('discard');if(dd){dd.remove();queueHist();return;}
  if(S.chatSub&&S.chatSub()){queueHist();return;}            // chat: close the + card / tag list / reply first
  var sc=document.getElementById('scrim');
  if(sc){                                                    // 2) sheet open → step back inside it, or close it
    if(sc.dataset.lock){queueHist();return;}
    if(S.guard&&S.guard()){queueHist();askDiscard(function(){if(sc.dataset.ret&&RET.length){retBack();queueHist();return;}closeSheet(true,true);});return;}
    S.guard=null;
    if(sc.dataset.ret&&RET.length){retBack();queueHist();return;}
    var bb=[].filter.call(sc.querySelectorAll('button'),function(b){return /^‹ \S/.test(b.textContent);})[0];
    if(bb)bb.click();else closeSheet(true,true);
    queueHist();return;}
  if(S.me&&S.view==='chats'&&S.chatSeg&&S.chatSeg!=='all'&&!st.seg&&st.k==='chats'){S.chatSeg='all';render();return;} // Messages on Jobs / Chats / Groups → Back goes to All first (its own entry was just taken off), the next Back goes to Today
  if(st.pad&&S.viewAs){stopViewAs();return;}
  if(st.pad){                                                // 3) below the first screen
    if(navKey()!=='home'&&navKey()!=='login|'){S.pick=null;S.view='home';S.tab=S.me;S.snStorm=null;render();window.scrollTo(0,0);return;}
    return;}
  if((st.me||'')!==(S.me||'')){history.back();return;}      // entry from before sign-in / sign-out: skip it

function errPlain(e){var t=e.text||'';

  if(/Service Spreadsheets|Service error|temporarily unavailable/i.test(t))return T('Google Sheets (where the app keeps its data) had a short hiccup on Google\'s side. The app now tries again by itself.');
  if(/Lock timeout/.test(t))return T('The app was very busy for a moment and had to try again.');
  if(/already exists/.test(t))return T('Two phones opened the app at the same second; it fixed itself.');
  if(/Notification failed/.test(t))return T('A notification could not be delivered to a phone.');
  if(/Failed to fetch|NO_SIGNAL|TIMEOUT|network/i.test(t))return T('Bad signal on the phone.');
  return t;}

function addressPicker(input){

  var list=el('div',{class:'sugg'});
  var check=el('a',{class:'chk',target:'_blank',rel:'noopener'},'🗺 '+T('Check on map'));
  function upd(){var v=input.value.trim();check.style.display=v?'':'none';check.href=mapsUrl(v);}

  input.addEventListener('input',function(){
    upd();clearTimeout(timer);var q=input.value.trim();

    },350);

  return el('div',{class:'notif'},el('span',{text:'🔔'}),el('div',{},el('b',{text:T('Turn on notifications')}),el('span',{class:'muted',text:text})),
    st==='default'?el('button',{onclick:function(){enablePush(true);}},T('Allow')):null,
    el('button',{class:'x','aria-label':T('Close'),onclick:function(){store('sam_nb_hide',String(Date.now()+3*864e5));render();}},el('span',{html:icoSvg('✕')})));
}
var swReg=null;
function getReg(){
  if(swReg)return Promise.resolve(swReg);
  return navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;return navigator.serviceWorker.ready.then(function(){return r;});});
}
// When the app is open on screen, Google hands notifications to the page instead of showing them,
// so show them ourselves (system notification + in-app banner) and refresh the list.
var fgOn=false;
function listenForeground(){
  if(fgOn||!window.firebase||!firebase.messaging)return;fgOn=true;
  try{firebase.messaging().onMessage(function(p){
    var n=(p&&p.notification)||{},d=(p&&p.data)||{},title=n.title||d.title||'SAM To-Do',body=n.body||d.body||'';
    if(!(window.Notification&&Notification.permission==='granted')){toast('🔔 '+title+(body?' — '+body.split('\n')[0]:''));return;} // notifications are off on this phone: just show it inside the app, no error
    getReg().then(function(reg){return reg.showNotification(title,{body:body,icon:'icon2-192.png',badge:'badge-96.png',tag:(p&&p.fcmOptions&&p.fcmOptions.analyticsLabel)||('fg'+Date.now()),renotify:true,data:{url:location.href,go:d.go||''}});})
      .catch(function(e){logErr('Foreground notification failed: '+String(e&&e.message||e),'');});
    toast('🔔 '+title+(body?' — '+body.split('\n')[0]:''));
    refresh(true);
  });}catch(e){fgOn=false;logErr('onMessage setup failed: '+String(e&&e.message||e),'');}
}
// The notification scripts load after the app is on screen, so a slow signal never shows a white page.
var fbWait=[];
function loadFirebase(cb){
  if(window.firebase&&firebase.messaging){cb();return;}fbWait.push(cb);if(fbWait.length>1)return;
  function add(src,next){var sc=document.createElement('script');sc.src=src;sc.onload=next;sc.onerror=function(){fbWait=[];};document.head.appendChild(sc);}
  add('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',function(){add('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js',function(){var w=fbWait;fbWait=[];w.forEach(function(f){try{f();}catch(e){}});});});
}
function deviceName(){
  var ua=navigator.userAgent,base=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android phone':/Windows/.test(ua)?'Windows computer':/Mac/.test(ua)?'Mac computer':'Device';
  var br=/Edg\//.test(ua)?'Edge':/SamsungBrowser/.test(ua)?'Samsung Internet':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'';
  var standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches;
  var tail=(br?' · '+br:'')+(standalone?' · app':'');
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues)return navigator.userAgentData.getHighEntropyValues(['model']).then(function(v){return (v.model?base.replace('Android phone','Android')+' '+v.model:base)+tail;}).catch(function(){return base+tail;});}catch(e){}
  return Promise.resolve(base+tail);
}
// The phone thinks alerts are on but the server lost its sign-up (old or dead token): get a fresh one and sign up again.
var HEALED=false;
function pushHeal(){if(HEALED||!S.me||S.viewAs||notifState()!=='granted')return;HEALED=true;store('sam_tok','');
  var go=function(){try{if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);getReg().then(function(reg){return firebase.messaging().deleteToken().catch(function(){});}).then(function(){enablePush(false);}).catch(function(){enablePush(false);});}catch(e){enablePush(false);}};
  if(!window.firebase||!firebase.messaging)loadFirebase(go);else go();}
function enablePush(ask){
  var st=notifState();
  if(st==='unsupported'||st==='ios-browser'||st==='denied')return;
  if(!window.firebase||!firebase.messaging){loadFirebase(function(){enablePush(ask);});return;}
  var perm=ask?Notification.requestPermission():Promise.resolve(Notification.permission);
  Promise.resolve(perm).then(function(p){
    render();
    if(p!=='granted')return;
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    listenForeground();
    return getReg().then(function(reg){return firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});})
      .then(function(token){if(!token)return;var key=S.me+'|'+LANG+'|'+token+'|d2';if(!ask&&store('sam_tok')===key)return;
        return deviceName().then(function(dn){return call('register',{token:token,lang:LANG,device:dn});}).then(function(){store('sam_tok',key);if(ask)toast('✓ '+T('Notifications are on'));});});
  }).catch(function(e){console.warn('push',e);});
}

if('serviceWorker' in navigator){getReg().catch(function(){});}
if(S.me){try{var pg=JSON.parse(sessionStorage.getItem('sam_page')||'null');if(pg&&pg.me===S.me&&pg.v&&pg.v!=='home'){S.view=pg.v;if(pg.tab)S.tab=pg.tab;if(pg.cd)S.crewDay=pg.cd;if(pg.ctd)S.crewTaskDay=pg.ctd;}}catch(e){}}
setTimeout(function(){if(S.me&&S.pin)rememberPin();},0);
if(S.me){try{var cached=JSON.parse(localStorage.getItem('sam_cache')||'null');if(cached&&cached.me&&cached.me.key===S.me){cached.__cached=1;apply(cached);S.loaded=true;}}catch(e){}}
render();
if(S.me&&S.loaded)runGo();
if(S.me){refresh(true);startPolling();if(notifState()==='granted')enablePush(false);}
// Swipe the whole page left / right to move between the bottom tabs (Today ⇄ Phones ⇄ Messages ⇄ Jobs ⇄ More)
(function(){var x0=null,y0=0,dx=0,lock=0,t0=0,els=[],W=1;
  function order(){return isOffice()?['home','phones','chats','jobs','more']:['home','phones','chats','more'];}
  function pageEls(){var a=document.getElementById('app');if(!a)return [];return [].filter.call(a.children,function(n){return n.tagName!=='NAV'&&n.tagName!=='HEADER';});}
  function setX(x,tr){els.forEach(function(n){n.style.transition=tr||'none';n.style.transform=x?'translateX('+x+'px)':'';});}
  function canStart(e){if(!S.me||S.snDrag||S.viewAs&&false)return false;
    if(document.getElementById('scrim')||document.getElementById('viewer')||document.getElementById('fptest'))return false;
    if(order().indexOf(S.view||'home')<0)return false;
    var tx=e.touches[0].clientX;if(tx<24||tx>window.innerWidth-24)return false;
    for(var n=e.target;n&&n!==document.body;n=n.parentNode){if(n.nodeType!==1)continue;var tg=n.tagName;
      if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||tg==='NAV'||tg==='HEADER'||tg==='VIDEO'||tg==='AUDIO')return false;
      if(n.classList.contains('snowsoon')||n.hasAttribute('data-noswipe'))return false;
      if(n.scrollWidth>n.clientWidth+4){var ox=getComputedStyle(n).overflowX;if(ox==='auto'||ox==='scroll')return false;}}
    return true;}
  function nb(d){var o=order(),i=o.indexOf(S.view||'home')+d;return i>=0&&i<o.length?o[i]:null;}
  // the "move" listener is only attached while a swipe could start, so normal scrolling never waits for the app
  document.addEventListener('touchstart',function(e){x0=null;if(e.touches.length!==1||!canStart(e))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;lock=0;t0=Date.now();W=window.innerWidth||360;document.addEventListener('touchmove',mv,{passive:false});},{passive:true});
  function mv(e){if(x0==null){document.removeEventListener('touchmove',mv,{passive:false});return;}if(e.touches.length!==1){end(true);return;}
    var mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;
    if(!lock){if(Math.abs(mx)<10&&Math.abs(my)<10)return;if(Math.abs(mx)>Math.abs(my)*1.5){lock=1;els=pageEls();}else{x0=null;return;}}
    if(e.cancelable)e.preventDefault();dx=mx;var has=nb(dx<0?1:-1);setX(has?dx:dx*0.25);}
  function end(cancel){document.removeEventListener('touchmove',mv,{passive:false});if(x0==null)return;x0=null;if(!lock)return;lock=0;
    var dir=dx<0?1:-1,to=nb(dir),v=Math.abs(dx)/Math.max(1,Date.now()-t0);
    if(cancel||!to||Math.abs(dx)<60||(Math.abs(dx)<W*0.28&&v<0.45)){setX(0,'transform .2s ease-out');return;}
    haptic();setX(-dir*W,'transform .16s ease-in');
    setTimeout(function(){els.forEach(function(n){n.style.transition='';n.style.transform='';});
      if(to==='jobs')openJobs();else goView(to);
      var ne=pageEls();ne.forEach(function(n){n.style.transition='none';n.style.transform='translateX('+(dir*W*0.35)+'px)';n.style.opacity='0.4';});
      void document.body.offsetWidth;
      ne.forEach(function(n){n.style.transition='transform .2s ease-out,opacity .2s ease-out';n.style.transform='';n.style.opacity='';});
      setTimeout(function(){ne.forEach(function(n){n.style.transition='';});},240);},160);}
  document.addEventListener('touchend',function(){end(false);},{passive:true});
  document.addEventListener('touchcancel',function(){end(true);},{passive:true});
})();
