<!DOCTYPE html>
<html><head><meta charset="utf-8"><base target="_top"><meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SAM To-Do</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAM To-Do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:only light;--bg:#F3F1EC;--card:#fff;--ink:#1D2125;--muted:#6B7078;--line:#E3DFD6;--acc:#2172B1;--ok:#2B8A3E;--half:#E8A100;--red:#D9342B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;background:#fff;color:var(--ink)}
.brand{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--acc)}
.hl{display:flex;align-items:center;gap:12px}
.badge{height:58px;width:auto;display:block}
.biglogo{width:240px;max-width:80%;display:block;margin:0 auto 6px;border-radius:18px;background:#fff;padding:12px}
.login h1{text-align:center}.login>.muted{text-align:center}
.title{font-size:26px;font-weight:800}
.right{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;color:var(--muted)}
.me{background:#EFECE5;color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:600}
.tabs{display:flex;gap:8px;padding:6px 16px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.tab{flex:1;padding:12px;border-radius:12px;background:#EFECE5;color:var(--ink);font-weight:700;font-size:17px;display:flex;justify-content:center;gap:8px;align-items:center}
.tab.on{background:var(--acc);color:#fff}
.count{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 9px;font-size:14px}
.count.red{background:var(--red);color:#fff}.tab.on .count{background:rgba(255,255,255,.28)}
.list{padding:8px 12px 120px;max-width:640px;margin:0 auto}
.group{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 8px}
.group.red{color:var(--red)}
.card{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-left:5px solid #C9C4B8;overflow:hidden}
.card.s-half{border-left-color:var(--half)}.card.s-done{border-left-color:var(--ok);opacity:.75}.card.od{border-left-color:var(--red)}
.cardhead{display:block;width:100%;text-align:left;padding:12px 14px 6px}
.ttl{font-weight:700;font-size:17px}.s-done .ttl{text-decoration:line-through}
.note{color:var(--muted);font-size:14px;margin-top:2px;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.due{font-weight:700;color:var(--ink)}.due.red{color:var(--red)}
.actions{display:flex;gap:8px;padding:6px 10px 10px;align-items:center}
.seg{display:flex;flex:1;background:#EFECE5;border-radius:10px;padding:3px;gap:3px}
.seg-b{flex:1;padding:10px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg-b.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg-b.half.on{background:var(--half);color:#fff}.seg-b.done.on{background:var(--ok);color:#fff}
.push{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.donetoggle{margin:18px 4px 8px;font-weight:700;color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;line-height:1;box-shadow:0 6px 16px rgba(33,114,177,.4)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:20px}
.in{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink);-webkit-appearance:none;min-height:48px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:-4px}
.primary{background:var(--acc);color:#fff;padding:15px;border-radius:12px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.6}
.ghost{padding:12px;color:var(--muted);font-weight:600}
.danger{padding:12px;color:var(--red);font-weight:700}
.opt{display:flex;justify-content:space-between;padding:15px;border:1.5px solid var(--line);border-radius:12px;font-weight:700}
.muted{color:var(--muted)}
.err{color:var(--red);font-size:14px}
.seg.wide{flex:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;white-space:nowrap}
.login{max-width:420px;margin:0 auto;padding:60px 24px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:40px}
.whos{display:flex;gap:10px}
.who{flex:1;padding:22px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:800}
.who.on{border-color:var(--acc);background:#E8F1FA}
.pin{width:100%;padding:16px;border:2px solid var(--line);border-radius:12px;font-size:22px;text-align:center;letter-spacing:.3em}
.retry{display:block;margin:10px auto;padding:12px 18px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
</style></head><body>

    else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x)n.appendChild(x);});
    else n.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return n;
}

function pad(n){return(n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){return ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dueLabel(s){var t=today();if(s===t)return 'Today';if(s===addDays(t,1))return 'Tomorrow';if(s===addDays(t,-1))return 'Yesterday';var d=parse(s);return DN[d.getDay()]+', '+MN[d.getMonth()]+' '+d.getDate();}

function toast(m){var t=el('div',{class:'toast',text:m});document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
function openSheet(children){closeSheet();var bg=el('div',{class:'scrim',id:'scrim'},el('div',{class:'sheet'},children));bg.addEventListener('click',function(e){if(e.target===bg)closeSheet();});document.body.appendChild(bg);}
function closeSheet(){var s=document.getElementById('scrim');if(s)s.remove();}

function render(){
  var app=document.getElementById('app');app.innerHTML='';
  if(!S.me||!S.pin){app.appendChild(loginView());return;}
  app.appendChild(header());app.appendChild(tabs());app.appendChild(listView());
  app.appendChild(el('button',{class:'fab','aria-label':'Add task',onclick:function(){openEditor(null);}},'+'));
}

function loginView(){
  var chosen=S.me||null,err=el('div',{class:'err'}),bY,bR;
  var pin=el('input',{class:'pin',type:'password',inputmode:'numeric',maxlength:'8',placeholder:'PIN',autocomplete:'off'});
  function pick(n){chosen=n;bY.classList.toggle('on',n==='Yossi');bR.classList.toggle('on',n==='Rocky');}
  bY=el('button',{class:'who',onclick:function(){pick('Yossi');}},'Yossi');
  bR=el('button',{class:'who',onclick:function(){pick('Rocky');}},'Rocky');
  var go=el('button',{class:'primary',onclick:function(){
    if(!chosen){err.textContent='Tap your name first.';return;}
    var p=pin.value.trim();if(!p){err.textContent='Enter the PIN.';return;}
    go.disabled=true;go.textContent='Checking…';err.textContent='';
    S.pin=p;S.me=chosen;
    call('list').then(function(list){S.tab=chosen;store('sam_me',chosen);store('sam_pin',p);S.tasks=list;S.loaded=true;S.err='';render();startPolling();})
    .catch(function(e){S.pin=null;go.disabled=false;go.textContent='Continue';err.textContent=isBadPin(e)?'Wrong PIN. Try again.':'Could not connect. Check your signal and try again.';});
  }},'Continue');
  if(chosen)pick(chosen);
  return el('div',{class:'login'},el('img',{class:'biglogo',src:LOGO,alt:'SAM Construction'}),el('h1',{text:'To-Do'}),el('p',{class:'muted',text:'Who is using this phone?'}),el('div',{class:'whos'},bY,bR),pin,err,go);
}

function header(){
  var other=S.me==='Yossi'?'Rocky':'Yossi';
  return el('header',{class:'top'},
    el('div',{class:'hl'},el('img',{class:'badge',src:LOGO,alt:'SAM Construction'}),el('div',{class:'title'},'To-Do')),
    el('div',{class:'right'},el('span',{class:'sync'},S.saving?'Saving…':''),
      el('button',{class:'me',onclick:function(){openSheet([
        el('h2',{text:'Signed in as '+S.me}),
        el('button',{class:'primary',onclick:function(){S.me=other;S.tab=other;store('sam_me',other);closeSheet();render();}},'Switch to '+other),
        el('button',{class:'ghost',onclick:function(){closeSheet();refresh(true);}},'Refresh now'),
        el('button',{class:'ghost',onclick:function(){closeSheet();store('sam_me',null);S.me=null;logout();}},'Sign out'),
        el('button',{class:'ghost',onclick:closeSheet},'Cancel')]);}},S.me+' ▾')));
}

function counts(o){var t=today(),n=0,od=0;S.tasks.forEach(function(x){if(x.owner===o&&x.status!=='done'){n++;if(x.due&&x.due<t)od++;}});return{n:n,od:od};}
function tabs(){
  return el('nav',{class:'tabs'},['Yossi','Rocky'].map(function(o){var c=counts(o);
    return el('button',{class:'tab'+(S.tab===o?' on':''),onclick:function(){S.tab=o;render();}},o,el('span',{class:'count'+(c.od?' red':'')},String(c.n)));}));
}

function byDue(a,b){var A=a.due||'9999',B=b.due||'9999';if(A!==B)return A<B?-1:1;return a.createdAt<b.createdAt?-1:1;}
function listView(){
  var t=today(),wrap=el('main',{class:'list'});
  if(!S.loaded){wrap.appendChild(el('p',{class:'empty',text:'Loading…'}));return wrap;}
  if(S.err){wrap.appendChild(el('p',{class:'empty',text:S.err}));wrap.appendChild(el('button',{class:'retry',onclick:function(){refresh(true);}},'Try again'));}
  var mine=S.tasks.filter(function(x){return x.owner===S.tab;});
  var open=mine.filter(function(x){return x.status!=='done';}).sort(byDue);
  var groups=[['Overdue',open.filter(function(x){return x.due&&x.due<t;})],['Today',open.filter(function(x){return x.due===t;})],['Coming up',open.filter(function(x){return x.due&&x.due>t;})],['No date',open.filter(function(x){return !x.due;})]];
  if(!open.length&&!S.err)wrap.appendChild(el('p',{class:'empty',text:'Nothing open for '+S.tab+'. Tap + to add a task.'}));
  groups.forEach(function(g){if(!g[1].length)return;wrap.appendChild(el('h3',{class:'group'+(g[0]==='Overdue'?' red':'')},g[0]+' · '+g[1].length));g[1].forEach(function(x){wrap.appendChild(card(x));});});
  var done=mine.filter(function(x){return x.status==='done';}).sort(function(a,b){return a.updatedAt<b.updatedAt?1:-1;});
  if(done.length){wrap.appendChild(el('button',{class:'donetoggle',onclick:function(){S.showDone=!S.showDone;render();}},(S.showDone?'▾ ':'▸ ')+'Completed · '+done.length));
    if(S.showDone)done.slice(0,50).forEach(function(x){wrap.appendChild(card(x));});}
  return wrap;
}

var STAT=[['todo','Not started'],['half','Halfway'],['done','Done']];
function card(x){
  var t=today(),od=x.status!=='done'&&x.due&&x.due<t;
  var by='Added by '+(x.createdBy||'?');if(x.updatedBy&&x.updatedBy!==x.createdBy)by+=' · updated by '+x.updatedBy;
  return el('div',{class:'card s-'+x.status+(od?' od':'')},
    el('button',{class:'cardhead',onclick:function(){openEditor(x);}},
      el('div',{class:'ttl',text:x.title}),
      x.note?el('div',{class:'note',text:x.note}):null,
      el('div',{class:'meta'},x.due?el('span',{class:'due'+(od?' red':''),text:(od?'Overdue · ':'')+dueLabel(x.due)}):null,el('span',{text:by}))),
    el('div',{class:'actions'},
      el('div',{class:'seg'},STAT.map(function(s){return el('button',{class:'seg-b '+s[0]+(x.status===s[0]?' on':''),onclick:function(){if(x.status!==s[0])save('update',{id:x.id,status:s[0]});}},s[1]);})),
      x.status!=='done'?el('button',{class:'push',onclick:function(){openPush(x);}},'Push →'):null));
}

function save(action,payload){
  var now=new Date().toISOString();
  if(action==='update')S.tasks.forEach(function(x){if(x.id===payload.id){for(var k in payload)if(k!=='id')x[k]=payload[k];x.updatedBy=S.me;x.updatedAt=now;}});
  else if(action==='delete')S.tasks=S.tasks.filter(function(x){return x.id!==payload.id;});
  else if(action==='add')S.tasks.push({id:'tmp'+Date.now(),owner:payload.owner,title:payload.title,note:payload.note,due:payload.due,status:'todo',createdBy:S.me,createdAt:now,updatedBy:S.me,updatedAt:now});
  S.saving++;render();
  call(action,payload).then(function(list){S.saving--;if(!S.saving)S.tasks=list;render();})
  .catch(function(e){S.saving--;if(isBadPin(e)){logout();return;}toast('Could not save — check signal');refresh(true);});
}

function refresh(force){
  if(!S.pin||(S.saving&&!force))return;
  call('list').then(function(list){if(S.saving)return;S.tasks=list;S.loaded=true;S.err='';render();})
  .catch(function(e){if(isBadPin(e)){logout();return;}S.loaded=true;if(!S.tasks.length)S.err='Could not load the list. Check your signal.';render();});
}
function startPolling(){
  if(S.poll)return;
  S.poll=setInterval(function(){if(!document.hidden)refresh();},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
}

function openEditor(x){
  var isNew=!x,owner=x?x.owner:S.tab,ob={};
  var title=el('input',{class:'in',placeholder:'What needs to be done?',maxlength:'200'});title.value=x?x.title:'';
  var note=el('textarea',{class:'in',rows:'2',placeholder:'Note — job, address, details (optional)',maxlength:'1000'});note.value=x?x.note:'';
  var due=el('input',{class:'in',type:'date'});due.value=x?x.due:today();
  var whoRow=el('div',{class:'seg wide'},['Yossi','Rocky'].map(function(o){
    ob[o]=el('button',{class:'seg-b'+(owner===o?' on':''),onclick:function(){owner=o;ob.Yossi.classList.toggle('on',o==='Yossi');ob.Rocky.classList.toggle('on',o==='Rocky');}},'For '+o);return ob[o];}));
  var err=el('div',{class:'err'});
  var kids=[el('h2',{text:isNew?'New task':'Edit task'}),whoRow,title,note,el('label',{class:'lbl',text:'Due date'}),due,err,
    el('button',{class:'primary',onclick:function(){
      var tt=title.value.trim();if(!tt){err.textContent='Type the task first.';title.focus();return;}
      var p={title:tt,note:note.value.trim(),due:due.value,owner:owner};closeSheet();
      if(owner!==S.tab)S.tab=owner;
      if(isNew)save('add',p);else{p.id=x.id;save('update',p);}
    }},isNew?'Add task':'Save changes')];
  if(!isNew){var armed=false,del=el('button',{class:'danger',onclick:function(){if(!armed){armed=true;del.textContent='Tap again to delete';return;}closeSheet();save('delete',{id:x.id});}},'Delete task');kids.push(del);}
  kids.push(el('button',{class:'ghost',onclick:closeSheet},'Cancel'));
  openSheet(kids);
  if(isNew)setTimeout(function(){title.focus();},50);
}

function openPush(x){
  var t=today(),base=x.due&&x.due>t?x.due:t;
  function opt(label,d){return el('button',{class:'opt',onclick:function(){closeSheet();save('update',{id:x.id,due:d});toast('Moved to '+dueLabel(d));}},el('span',{text:label}),el('span',{class:'muted',text:dueLabel(d)}));}
  var pick=el('input',{class:'in',type:'date'});pick.value=addDays(base,1);
  openSheet([el('h2',{text:'Push to later'}),el('p',{class:'muted',text:x.title}),
    opt(base===t?'Tomorrow':'1 day later',addDays(base,1)),opt('2 days later',addDays(base,2)),opt('1 week later',addDays(base,7)),
    el('label',{class:'lbl',text:'Or pick a date'}),pick,
    el('button',{class:'primary',onclick:function(){if(!pick.value)return;closeSheet();save('update',{id:x.id,due:pick.value});toast('Moved to '+dueLabel(pick.value));}},'Move to this date'),
    el('button',{class:'ghost',onclick:closeSheet},'Cancel')]);
}

render();
if(S.me&&S.pin){refresh(true);startPolling();}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
</script></body></html>
