<!DOCTYPE html>
<html><head><meta charset="utf-8"><base target="_top"><meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAM To-Do</title>
<meta name="theme-color" content="#BDEBDF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAM To-Do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon4-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon4.png">
<style>
:root{color-scheme:only light;--bg:#F3F1EC;--card:#fff;--ink:#1D2125;--muted:#6B7078;--line:#E3DFD6;--acc:#2172B1;--ok:#2B8A3E;--half:#E8A100;--red:#D9342B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;background:#fff;color:var(--ink)}
.brand{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--acc)}
.hl{display:flex;align-items:center;gap:12px}
.badge{height:58px;width:auto;display:block}
.biglogo{width:240px;max-width:80%;display:block;margin:0 auto 6px;border-radius:18px;background:#fff;padding:12px}
.login h1{text-align:center}.login>.muted{text-align:center}
.title{font-size:26px;font-weight:800}
.right{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;color:var(--muted)}
.me{background:#EFECE5;color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:600}
.tabs{display:flex;gap:8px;padding:6px 16px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.tab{flex:1;padding:12px;border-radius:12px;background:#EFECE5;color:var(--ink);font-weight:700;font-size:17px;display:flex;justify-content:center;gap:8px;align-items:center}
.tab.on{background:var(--acc);color:#fff}
.count{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 9px;font-size:14px}
.count.red{background:var(--red);color:#fff}.tab.on .count{background:rgba(255,255,255,.28)}
.list{padding:8px 12px 120px;max-width:640px;margin:0 auto}
.group{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 8px}
.group.red{color:var(--red)}
.card{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-left:5px solid #C9C4B8;overflow:hidden}
.card.s-half{border-left-color:var(--half)}.card.s-done{border-left-color:var(--ok);opacity:.75}.card.od{border-left-color:var(--red)}
.cardhead{display:block;width:100%;text-align:left;padding:12px 14px 6px}
.ttl{font-weight:700;font-size:17px}.s-done .ttl{text-decoration:line-through}
.note{color:var(--muted);font-size:14px;margin-top:2px;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.due{font-weight:700;color:var(--ink)}.due.red{color:var(--red)}
.actions{display:flex;gap:8px;padding:6px 10px 10px;align-items:center}
.seg{display:flex;flex:1;background:#EFECE5;border-radius:10px;padding:3px;gap:3px}
.seg-b{flex:1;padding:10px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg-b.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg-b.half.on{background:var(--half);color:#fff}.seg-b.done.on{background:var(--ok);color:#fff}
.push{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.donetoggle{margin:18px 4px 8px;font-weight:700;color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;line-height:1;box-shadow:0 6px 16px rgba(33,114,177,.4)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:20px}
.in{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink);-webkit-appearance:none;min-height:48px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:-4px}
.primary{background:var(--acc);color:#fff;padding:15px;border-radius:12px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.6}
.ghost{padding:12px;color:var(--muted);font-weight:600}
.danger{padding:12px;color:var(--red);font-weight:700}
.opt{display:flex;justify-content:space-between;padding:15px;border:1.5px solid var(--line);border-radius:12px;font-weight:700}
.muted{color:var(--muted)}
.err{color:var(--red);font-size:14px}
.seg.wide{flex:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;white-space:nowrap}
.login{max-width:420px;margin:0 auto;padding:60px 24px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:40px}
.whos{display:flex;gap:10px}
.who{flex:1;padding:22px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:800}
.who.on{border-color:var(--acc);background:#E8F1FA}
.lang{display:flex;justify-content:center;gap:6px;margin-top:6px}.lang-b{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--muted);background:#fff}.lang-b.on{border-color:var(--acc);color:var(--acc);background:#E8F1FA}
.retry{display:block;margin:10px auto;padding:12px 18px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.urg{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:2px}
.card.urgent{border-left-color:var(--red);box-shadow:0 0 0 1.5px rgba(217,52,43,.35),0 1px 2px rgba(0,0,0,.06)}
.addr{display:flex;align-items:center;gap:6px;margin:6px 14px 0;padding:9px 12px;border-radius:10px;background:#E8F1FA;color:var(--acc);font-weight:700;font-size:14px;text-decoration:none}
.addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2{display:flex;gap:10px}.row2>div{flex:1;display:flex;flex-direction:column;gap:6px}
.urgbtn{display:flex;align-items:center;justify-content:space-between;padding:13px;border:1.5px solid var(--line);border-radius:10px;font-weight:700}
.urgbtn .sw{width:46px;height:28px;border-radius:999px;background:#D7D3CA;position:relative;transition:.15s}
.urgbtn .sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.urgbtn.on{border-color:var(--red);color:var(--red)}.urgbtn.on .sw{background:var(--red)}.urgbtn.on .sw:after{left:21px}
.notif{margin:12px 12px 0;padding:12px 14px;border-radius:12px;background:#FFF6E0;border:1px solid #F1D48A;display:flex;gap:10px;align-items:center;font-size:14px}
.notif b{display:block}.notif button{margin-left:auto;background:var(--acc);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;white-space:nowrap}
.notif .x{background:none;color:var(--muted);padding:6px;margin-left:0}
.whos{flex-wrap:wrap}.who{min-width:30%}
.tab{font-size:15px;padding:12px 4px;gap:6px}
.who-opt{display:flex;gap:8px}
.crewbtn{flex:none;width:100%;font-size:17px;padding:16px}
.daybar{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.dayarrow{width:46px;height:46px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:26px;font-weight:700;line-height:1}
.daylabel{flex:1;height:46px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:16px}
.cbtn{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.summary{color:var(--muted);font-size:14px;margin:8px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:#fff;border:1.5px dashed #C9C4B8;font-weight:600;font-size:14px}
.owner{font-size:13px;font-weight:700;color:var(--acc);margin-top:2px}
.crewrow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.crewbox{display:flex;flex-direction:column;gap:6px}
.crewlist{display:flex;flex-direction:column;max-height:38vh;overflow:auto;border:1.5px solid var(--line);border-radius:10px}
.crewopt{display:flex;align-items:center;gap:10px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-weight:600}
.crewopt .box{width:22px;height:22px;border-radius:6px;border:2px solid #C9C4B8;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.crewopt.on{background:#E8F1FA}.crewopt.on .box{background:var(--acc);border-color:var(--acc)}
.thumbs{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#EFECE5;flex:none}
.cam{padding:10px}
.telbtn.sm{width:38px;height:38px;font-size:17px}
.addrwrap{position:relative;display:flex;flex-direction:column;gap:4px}
.sugg{display:none;background:#fff;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.sugg-i{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}
.sugg-i:last-child{border-bottom:0}.sugg-i:active{background:#E8F1FA}
.sugg-m{font-weight:700;font-size:15px}.sugg-s{font-size:13px;color:var(--muted)}
.chk{font-size:13px;font-weight:700;color:var(--acc);text-decoration:none;padding:2px 4px}
.pinin{width:100%;padding:16px;border:2px solid var(--line);border-radius:12px;font-size:28px;text-align:center;letter-spacing:.5em;background:#fff;color:var(--ink)}
.jobtag{font-size:13px;font-weight:700;color:#8A5A00;margin-top:3px}
.jobpick{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;background:#FFF4DC;font-weight:700;font-size:15px;color:#6B4600}
.jobpick.on{background:#F2B233;color:#3A2600}
.joblist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;background:#fff}
.jobopt{display:flex;flex-direction:column;align-items:flex-start;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-weight:700}
.jobopt small{font-weight:500;color:#6B7078;font-size:12px;margin-top:2px}
.jobopt.on{background:#FFF4DC}
.jobopt.add{color:var(--acc);background:#E8F1FA}
.jobnew{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed #F2B233;border-radius:10px}
.ann{background:#FFF4DC;border:2px solid #F2B233;border-radius:14px;padding:12px 14px;margin:0 0 12px}
.ann .from{font-size:13px;font-weight:700;color:#8A5A00}
.ann .txt{font-size:17px;font-weight:800;margin:6px 0 10px;white-space:pre-wrap;color:#1F2328}
.ann button{width:100%}
.annrow{padding:10px 4px;border-bottom:1px solid var(--line)}
.annrow .txt{white-space:pre-wrap;margin:2px 0 4px;font-weight:800}
.annrow details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px}
.allbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border-radius:10px;background:#EFECE5;font-weight:700;font-size:15px}
.allbtn.on{background:var(--acc);color:#fff}
.cmts{background:#F4F6F9;border-radius:10px;padding:8px 10px;margin:8px 0 2px;display:flex;flex-direction:column;gap:5px}
.cmt{font-size:14px;line-height:1.35;white-space:pre-wrap}
.cmt .cwhen{color:#8A9099;font-size:12px}
.cmore{align-self:flex-start;color:var(--acc);font-weight:600;font-size:13px;padding:0}
.actions{gap:6px;padding:6px 8px 10px}
.seg{min-width:0}
.seg-b{padding:10px 2px;font-size:12.5px;min-width:0}
.push{padding:10px 9px}
.cam{padding:10px 7px}
.vids{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px}
.vidtile{display:flex;align-items:center;gap:8px;background:#1F2328;color:#fff;border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px}
.vidtile .play{background:#fff;color:#1F2328;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.pbar{height:12px;background:#EFECE5;border-radius:6px;overflow:hidden;margin:10px 0}
.pfill{height:100%;width:0;background:var(--acc);transition:width .3s}
.viewseg{display:flex;gap:6px;margin:4px 0 8px}
.vbtn{flex:1;padding:9px;border-radius:10px;background:#EFECE5;font-weight:700;font-size:14px}
.vbtn.on{background:var(--acc);color:#fff}
.teamline{font-size:14px;font-weight:700;color:#2B6CB0;margin-top:3px}
.repcard{background:#FFF8E6;border:2px solid #F2B233;border-radius:14px;padding:12px 14px;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.repcard.ok{background:#EDF8EF;border-color:#7CC48A}
.reptitle{font-weight:800;font-size:17px}
.reprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.reprow.off .rname,.reprow.off b{color:#A0A4AA;text-decoration:line-through}
.rname{flex:1;min-width:90px;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.otbox{display:flex;align-items:center;gap:5px;flex:none;margin-left:auto}
.otbox b{min-width:30px;text-align:center}
.ot{width:32px;height:32px;border-radius:8px;background:#EFECE5;font-weight:900;font-size:18px}
.chip.on{background:var(--acc);color:#fff;border-style:solid;border-color:var(--acc)}
.repsum{font-weight:800;margin:8px 0;padding:8px 10px;background:#F4F6F9;border-radius:10px}
.pst{width:24px;text-align:center}
.otpill{background:#FFF0D1;color:#8A5A00;font-weight:800;border-radius:999px;padding:3px 9px;font-size:13px}
.wktable{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wkrow{display:grid;grid-template-columns:1fr auto 70px;gap:8px;padding:7px 10px;border-bottom:1px solid #F1EEE8;font-size:14px}
.wkrow:last-child{border-bottom:0}
.wkrow b{text-align:right}
.actgrid{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.agrow{display:grid;grid-template-columns:1fr repeat(7,26px);align-items:center;border-bottom:1px solid #F1EEE8}
.agrow:last-child{border-bottom:0}
.agrow span{text-align:center;padding:6px 0}
.agrow .agname{text-align:left;padding:6px 8px;font-weight:600}
.agrow.head span{font-weight:800;color:var(--muted)}
.agrow.head span.cur{color:var(--acc)}
.agrow span.on{color:var(--ok);font-weight:900;background:#EDF8EF}
.yn{display:flex;gap:4px;flex:none}
.yn button{width:38px;height:38px;border-radius:10px;border:2px solid #D5D9DE;background:#fff;color:#A0A4AA;font-weight:900;font-size:18px}
.yn .y.on{background:var(--ok);border-color:var(--ok);color:#fff}
.yn .n.on{background:#C92A2A;border-color:#C92A2A;color:#fff}
.scard{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:#fff}
.scard.off{background:#F7F6F3}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.snum{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sdrv{font:inherit;font-weight:800;font-size:17px;border:none;background:transparent;color:var(--ink);padding:4px 0;max-width:55%}
.stime{width:150px;min-width:150px;flex:none}
.stog{margin-top:6px;font-size:13px;font-weight:700;color:#7A5B00;background:#FFF4D6;border-radius:8px;padding:5px 8px}
.smem{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.schip{width:auto;flex:none;padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.schip.in{background:#E8F1FA;border-color:#B9D4EC}.schip.in::after{content:' ✕';color:var(--muted);font-size:12px}
.schip.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.schip.add{border-style:dashed;border-color:var(--acc);color:var(--acc)}
.schedbig{width:100%;font-size:18px;padding:16px;margin:4px 0 10px}
.schsum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:12px}
.schok{font-size:13px;font-weight:800;color:var(--ok);padding:6px 2px}
.schline{display:flex;align-items:center;gap:8px;width:100%;padding:11px 2px;border-top:1px solid var(--line);text-align:left;background:none;font-size:16px}
.schdrv{font-weight:800}.schjob{flex:1;min-width:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.schcnt{color:var(--muted);font-weight:700;font-size:14px}
.teambox{margin:8px 0 4px;padding:10px;background:#EAF3FB;border-radius:12px}
.teamhd{font-size:16px;font-weight:800;color:#1D4F7A;margin-bottom:8px}
.teamchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid #B9D4EC;font-size:18px;font-weight:800;color:var(--ink)}
.tchip.drv{background:#FFF4D6;border-color:#E8C35A}
.wkdays{display:flex;flex-direction:column;gap:6px}
.wkday{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 12px;border-radius:12px;border:1.5px solid #F1C4C4;background:#FFF5F5;font-size:16px;font-weight:700;text-align:left;color:var(--ink)}
.wkday .wst{color:#C92A2A;font-weight:800}
.wkday.ok{border-color:#B7E1C1;background:#F0FAF2}.wkday.ok .wst{color:var(--ok)}
.wkday.today{box-shadow:0 0 0 2px var(--acc)}
.wkday.fut{opacity:.4;background:#fff;border-color:var(--line)}
.repdate{font-size:18px;font-weight:800;margin:0 0 10px}
html,body{overflow-x:hidden;max-width:100%}
.sheet{overflow-x:hidden}
img,video,canvas,table{max-width:100%}
.list,.sheet,.card,.repcard,.scard{min-width:0;overflow-wrap:anywhere}
.tabs{gap:6px;padding:6px 10px 12px}
.tab{min-width:0;padding:10px 2px;gap:4px;flex-wrap:wrap;text-align:center;line-height:1.15}
.row2>div{min-width:0}.row2 .in{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:360px){.tab{font-size:14px}.count{padding:1px 6px;font-size:12px}}
.sheet>*{flex-shrink:0}
.backlink{align-self:flex-start;background:none;border:none;color:var(--acc);font-weight:800;font-size:16px;padding:4px 0}
.crewbig{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:#fff}
.cbname{font-size:20px;font-weight:900;color:var(--ink)}
.cbline{font-size:16px;font-weight:800}.cbline.ok{color:var(--ok)}.cbline.bad{color:#C92A2A}
.wktotal{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:#E6F6F1;font-weight:800;font-size:17px}
.homelink{display:block;background:none;border:none;color:var(--acc);font-weight:800;font-size:17px;padding:10px 16px 0}
.homegrid{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.homebtn{display:flex;align-items:center;gap:14px;width:100%;padding:20px 18px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-size:20px;font-weight:800;color:var(--ink);text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.homebtn .hi{font-size:28px;width:36px;text-align:center}

  wrap.appendChild(el('div',{class:'jhtitle',text:(jb.active==='closed'?'✓ ':'🏗 ')+jb.name}));
  if(jb.active==='closed')wrap.appendChild(el('div',{class:'jhclosed',text:'✓ '+T('Finished job – in Past jobs')}));
  if(jb.address||h.first)wrap.appendChild(el('div',{class:'jhaddr',style:'margin:2px 0 10px'},jb.address?el('a',{href:mapsUrl(jb.address),target:'_blank',rel:'noopener',style:'color:inherit;text-decoration:none'},'📍 '+jb.address):null,h.first?(jb.address?' · ':'')+T('started')+' '+shortDay(h.first):null));
  function chip(id,label){return el('button',{class:'jhchip'+(f===id?' on':''),onclick:function(){h.f=id;render();}},label);}
  wrap.appendChild(el('div',{class:'jhchips'},chip('all',T('All')),c.photos?chip('photos','📷 '+T('Photos')+' '+c.photos):null,c.videos?chip('videos','🎥 '+T('Videos')+' '+c.videos):null,c.files?chip('files','📄 '+T('Files')+' '+c.files):null,c.chat?chip('chat','💬 '+T('Chat')+' '+c.chat):null));
  if(h.err)wrap.appendChild(el('p',{class:'empty'},T('Could not load — check signal'),el('br'),el('button',{class:'retry',onclick:function(){loadHist();render();}},T('Try again'))));
  if(!h.days.length&&h.loading)wrap.appendChild(el('p',{class:'empty',text:T('Loading…')}));
  if(!h.days.length&&!h.loading&&!h.err)wrap.appendChild(el('p',{class:'empty',text:T('Nothing yet.')}));
  var shown=0;
  h.days.forEach(function(D){
    var its=D.items.filter(function(it){return f==='all'||(f==='photos'&&it.photo)||(f==='videos'&&it.video)||(f==='files'&&it.file)||(f==='chat'&&(it.text||it.voice));});
    if(f!=='all'&&!its.length)return;shown++;
    var card=el('div',{class:'jhday'});
    if(f==='all'){
      if(D.who.length)card.appendChild(el('div',{class:'jhwho',text:'👷 '+D.who.join(', ')}));
      (D.steady||[]).forEach(function(s){card.appendChild(el('div',{class:'jhwho',text:'👥 '+s.crew+': '+s.came+' '+T('came')+(s.acts.length?' · '+s.acts.map(T).join(', '):'')+(s.note?' · '+s.note:'')}));});
      if(D.checks&&D.checks.length)card.appendChild(el('div',{class:'jhwho',text:'📍 Yossi '+T('checked in')+' '+D.checks.map(clockOf).join(', ')}));
    }
    var ph=its.filter(function(i){return i.photo;}),vd=its.filter(function(i){return i.video;}),fl=its.filter(function(i){return i.file;}),ch=its.filter(function(i){return i.text||i.voice;});
    if(ph.length||vd.length)card.appendChild(el('div',{class:'jhmedia'},ph.map(function(i){return thumb(i.photo);}).concat(vd.map(function(i){
      return el('button',{class:'jhvid',onclick:function(){playVideo({id:i.video,dur:i.dur});}},el('span',{text:'▶'}),el('small',{text:i.dur?fmtDur(i.dur):T('Video')}));}))));
    fl.forEach(function(i){card.appendChild(el('button',{class:'jhfile',onclick:function(){openFile(i);}},el('span',{text:fileIcon(i)}),el('b',{text:i.name||T('File')}),el('small',{text:fmtSize(i.size)})));});
    if(ch.length)card.appendChild(el('div',{class:'jhchat'},ch.map(function(i){
      return el('div',{},el('b',{text:i.by+': '}),i.voice?voiceTile({voice:i.voice,dur:i.dur}):document.createTextNode(i.text));})));
    if(!card.childNodes.length)return;
    wrap.appendChild(el('div',{class:'jhdate',text:(D.date===today()?T('Today')+' · ':'')+dateLabel(D.date)}));
    wrap.appendChild(card);
  });
  if(h.days.length&&!shown&&!h.more)wrap.appendChild(el('p',{class:'empty',text:T('Nothing yet.')}));
  if(h.more)wrap.appendChild(el('button',{class:'jhmore',onclick:function(e){e.target.textContent=T('Loading…');loadHist(h.days[h.days.length-1].date);}},h.loading&&h.days.length?T('Loading…'):T('Show older days')+' ›'));
  var cb=jobCloseBtn(jobOf(h.job));if(cb)wrap.appendChild(cb);
  var jdel=jobOf(h.job);if(jdel&&isOffice()){var armJ=false,db=el('button',{class:'jhdel',onclick:function(){if(!armJ){armJ=true;db.textContent='🗑 '+T('Tap again to delete this job');return;}
    var was=jdel.active;jdel.active='0';JUSE=null;toast('🗑 '+T('Job deleted')+' · '+jdel.name);navRepl=true;openJobs();
    call('jobRemove',{id:jdel.id}).then(function(r){apply(r);render();}).catch(function(e){jdel.active=was;render();toast('❗ '+T('Not deleted')+': '+errText(e));});}},'🗑 '+T('Delete job'));wrap.appendChild(db);
    wrap.appendChild(el('div',{class:'muted',style:'font-size:12px;text-align:center;margin-top:4px',text:T('Deleting hides the job. Its photos and history stay; you can bring it back in App maintenance → Undo.')}));}
  return wrap;
}
function openJobManager(){

    el('button',{class:'primary',onclick:function(){openJobEdit(null);}},T('+ Add new job'))];

    kids.push(el('div',{class:'crewrow'},el('div',{style:'flex:1;min-width:0'},el('b',{text:j.name}),j.address?el('div',{class:'muted',style:'font-size:13px',text:j.address}):el('div',{class:'muted',style:'font-size:13px',text:T('No address yet')})),
      j.address?el('a',{class:'cbtn mapbtn',href:mapsUrl(j.address),target:'_blank',rel:'noopener'},'📍 '+T('Map')):null,

function openJobEdit(j){
  var kids=[el('button',{class:'homelink',style:'padding-left:0',onclick:openJobManager},'‹ '+T('Jobs')),el('h2',{text:j?T('Edit job'):T('+ Add new job')}),jobForm(j,function(){render();openJobManager();},openJobManager)];
  if(j){var armed=false,rm=el('button',{class:'danger',onclick:function(){if(!armed){armed=true;rm.textContent=T('Tap again to remove');return;}
    call('jobRemove',{id:j.id}).then(function(r){apply(r);render();openJobManager();}).catch(function(){toast(T('Could not save — check signal'));});}},T('Remove'));kids.push(rm);}

// ---------- address suggestions ----------
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});}
function addressPicker(input){
  var session=uuid(),timer=null,seq=0,picked=input.value;
  var list=el('div',{class:'sugg'});
  var check=el('a',{class:'chk',target:'_blank',rel:'noopener'},'🗺 '+T('Check on map'));
  function upd(){var v=input.value.trim();check.style.display=v?'':'none';check.href=mapsUrl(v);}
  function clear(){list.innerHTML='';list.style.display='none';}
  input.addEventListener('input',function(){
    upd();clearTimeout(timer);var q=input.value.trim();
    if(q.length<3||q===picked){clear();return;}
    timer=setTimeout(function(){
      var my=++seq;
      call('places',{q:q,session:session}).then(function(res){
        if(my!==seq)return;list.innerHTML='';
        if(!res||!res.length){clear();return;}
        res.forEach(function(r){
          list.appendChild(el('button',{class:'sugg-i',type:'button',onmousedown:function(e){e.preventDefault();},onclick:function(){
            input.value=r.text;picked=r.text;session=uuid();clear();upd();}},
            el('span',{class:'sugg-m',text:'📍 '+(r.main||r.text)}),r.sub?el('span',{class:'sugg-s',text:r.sub}):null));
        });
        list.style.display='block';
      }).catch(function(){clear();});
    },350);
  });
  input.addEventListener('blur',function(){setTimeout(clear,200);});
  clear();upd();
  return el('div',{class:'addrwrap'},input,list,check);
}

// ---------- notifications ----------
var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function notifState(){
  if(isIOS&&!standalone)return 'ios-browser';
  if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window))return 'unsupported';
  return Notification.permission;
}
function pinBanner(){
  // one slim line, only on the first screen (never on the snow route)
  if(!S.weak||(S.view||'home')!=='home'||S.viewAs)return null;var sn=+(store('sam_pin_snooze')||0);if(Date.now()<sn)return null;
  return el('div',{class:'pinstrip'},el('button',{class:'pinmain',onclick:openPinChange},el('span',{text:'🔒 '+T('Pick your own PIN')}),el('b',{text:T('Change')+' ›'})),
    el('button',{class:'pinx','aria-label':T('Close'),onclick:function(){store('sam_pin_snooze',String(Date.now()+3*864e5));render();}},'✕'));
}
function notifBanner(){
  var st=notifState();
  if(st!=='default'&&st!=='ios-browser')return null;
  var nbh=store('sam_nb_hide');if(nbh&&(nbh==='1'?false:Date.now()<+nbh))return null;
  var text=st==='ios-browser'?T('To get notifications on iPhone, open SAM To-Do from your home screen icon.'):T('Get alerts for new tasks and reminders.');
  return el('div',{class:'notif'},el('span',{text:'🔔'}),el('div',{},el('b',{text:T('Turn on notifications')}),el('span',{class:'muted',text:text})),
    st==='default'?el('button',{onclick:function(){enablePush(true);}},T('Allow')):null,
    el('button',{class:'x','aria-label':'Close',onclick:function(){store('sam_nb_hide',String(Date.now()+3*864e5));render();}},'✕'));
}
var swReg=null;
function getReg(){
  if(swReg)return Promise.resolve(swReg);
  return navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;return navigator.serviceWorker.ready.then(function(){return r;});});
}
// When the app is open on screen, Google hands notifications to the page instead of showing them,
// so show them ourselves (system notification + in-app banner) and refresh the list.
var fgOn=false;
function listenForeground(){
  if(fgOn||!window.firebase||!firebase.messaging)return;fgOn=true;
  try{firebase.messaging().onMessage(function(p){
    var n=(p&&p.notification)||{},d=(p&&p.data)||{},title=n.title||d.title||'SAM To-Do',body=n.body||d.body||'';
    getReg().then(function(reg){return reg.showNotification(title,{body:body,icon:'icon2-192.png',badge:'badge-96.png',tag:(p&&p.fcmOptions&&p.fcmOptions.analyticsLabel)||('fg'+Date.now()),renotify:true,data:{url:location.href,go:d.go||''}});})
      .catch(function(e){logErr('Foreground notification failed: '+String(e&&e.message||e),'');});
    toast('🔔 '+title+(body?' — '+body.split('\n')[0]:''));
    refresh(true);
  });}catch(e){fgOn=false;logErr('onMessage setup failed: '+String(e&&e.message||e),'');}
}
// The notification scripts load after the app is on screen, so a slow signal never shows a white page.
var fbWait=[];
function loadFirebase(cb){
  if(window.firebase&&firebase.messaging){cb();return;}fbWait.push(cb);if(fbWait.length>1)return;
  function add(src,next){var sc=document.createElement('script');sc.src=src;sc.onload=next;sc.onerror=function(){fbWait=[];};document.head.appendChild(sc);}
  add('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',function(){add('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js',function(){var w=fbWait;fbWait=[];w.forEach(function(f){try{f();}catch(e){}});});});
}
function deviceName(){
  var ua=navigator.userAgent,base=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android phone':/Windows/.test(ua)?'Windows computer':/Mac/.test(ua)?'Mac computer':'Device';
  var br=/Edg\//.test(ua)?'Edge':/SamsungBrowser/.test(ua)?'Samsung Internet':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'';
  var standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches;
  var tail=(br?' · '+br:'')+(standalone?' · app':'');
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues)return navigator.userAgentData.getHighEntropyValues(['model']).then(function(v){return (v.model?base.replace('Android phone','Android')+' '+v.model:base)+tail;}).catch(function(){return base+tail;});}catch(e){}
  return Promise.resolve(base+tail);
}
// The phone thinks alerts are on but the server lost its sign-up (old or dead token): get a fresh one and sign up again.
var HEALED=false;
function pushHeal(){if(HEALED||!S.me||S.viewAs||notifState()!=='granted')return;HEALED=true;store('sam_tok','');
  var go=function(){try{if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);getReg().then(function(reg){return firebase.messaging().deleteToken().catch(function(){});}).then(function(){enablePush(false);}).catch(function(){enablePush(false);});}catch(e){enablePush(false);}};
  if(!window.firebase||!firebase.messaging)loadFirebase(go);else go();}
function enablePush(ask){
  var st=notifState();
  if(st==='unsupported'||st==='ios-browser'||st==='denied')return;
  if(!window.firebase||!firebase.messaging){loadFirebase(function(){enablePush(ask);});return;}
  var perm=ask?Notification.requestPermission():Promise.resolve(Notification.permission);
  Promise.resolve(perm).then(function(p){
    render();
    if(p!=='granted')return;
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    listenForeground();
    return getReg().then(function(reg){return firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});})
      .then(function(token){if(!token)return;var key=S.me+'|'+LANG+'|'+token+'|d2';if(!ask&&store('sam_tok')===key)return;
        return deviceName().then(function(dn){return call('register',{token:token,lang:LANG,device:dn});}).then(function(){store('sam_tok',key);if(ask)toast('✓ '+T('Notifications are on'));});});
  }).catch(function(e){console.warn('push',e);});
}

if('serviceWorker' in navigator){getReg().catch(function(){});}
if(S.me){try{var pg=JSON.parse(sessionStorage.getItem('sam_page')||'null');if(pg&&pg.me===S.me&&pg.v&&pg.v!=='home'){S.view=pg.v;if(pg.tab)S.tab=pg.tab;if(pg.cd)S.crewDay=pg.cd;if(pg.ctd)S.crewTaskDay=pg.ctd;}}catch(e){}}
setTimeout(function(){if(S.me&&S.pin)rememberPin();},0);
if(S.me){try{var cached=JSON.parse(localStorage.getItem('sam_cache')||'null');if(cached&&cached.me&&cached.me.key===S.me){cached.__cached=1;apply(cached);S.loaded=true;}}catch(e){}}
render();
if(S.me&&S.loaded)runGo();
if(S.me){refresh(true);startPolling();if(notifState()==='granted')enablePush(false);}
</script></body></html>
